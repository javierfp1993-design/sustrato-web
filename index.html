function freqDishes(mid,k){const out={};for(let i=1;i<=60;i++){const d=shiftKey(k,-i),e=(S.log[d]||{})[mid];let id=null,sc=1;
    if(e&&e.st==="chg"&&e.d){id=e.d;sc=e.s||1}else if(e&&e.st==="done"){const a=(S.menu[d]||{})[mid];if(a){id=a.d;sc=(a.s||1)*(e.r||1)}}
    if(id&&dishById(id)){const o=out[id]=out[id]||{id,n:0,s:sc,last:d};o.n++}}
  const cur=(S.menu[k]||{})[mid];return Object.values(out).filter(o=>!cur||o.id!==cur.d).sort((a,b)=>b.n-a.n||(a.last<b.last?1:-1)).slice(0,4)}
function weekCopyPlan(kind,wk){const tk=today(),src=kind==="train"?(S.plan||{}):(S.menu||{}),days=[];
  for(let i=0;i<7;i++){const t=shiftKey(wk,i),f=shiftKey(wk,i-7),a=src[f],b=src[t];
    const has=x=>kind==="train"?(x||[]).filter(y=>!y.skip).length>0:x&&Object.keys(x).length>0;
    if(t>=tk&&has(a)&&!has(b))days.push([f,t])}
  return days}

function phThumb(file){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,240/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.8))};i.onerror=()=>res(null);i.src=fr.result};fr.onerror=()=>res(null);fr.readAsDataURL(file)})}
async function photoEstimate(mid,file,hint){
  if(!S.sample||!file)return;const k=S.day;
  S.mealMenu=null;S.phFile=file;
  if(!S.ph||S.ph.mid!==mid||S.ph.k!==k)S.ph={mid,k,img:null};
  Object.assign(S.ph,{busy:true,err:null,res:null,r:1,ask:false,hint:hint||""});render();
  if(!S.ph.img){S.ph.img=await phThumb(file);render()}
  const h=hint?` El usuario indica que es: "${String(hint).slice(0,120)}". Úsalo como verdad y estima solo las cantidades.`:"";
  try{const r=await S.sample.json(`Analiza la foto de una comida.${h} Identifica el plato y sus componentes visibles y estima los gramos de cada uno por su tamaño aparente (usa el plato, los cubiertos o las manos como referencia). Calcula los macros del total.
Responde solo JSON: {"name":"nombre corto en español","portion":"la ración en pocas palabras, p. ej. 1 plato hondo","items":[{"n":"lentejas cocidas","g":250}],"P":gramos_proteina,"C":gramos_hidratos,"F":gramos_grasa,"confidence":"alta|media|baja"}`,{images:file,modelTier:"default"});
    const P=+r.P,C=+r.C,F=+r.F;if(![P,C,F].every(isFinite))throw{code:"invalid_json"};
    if(!S.ph||S.ph.mid!==mid)return;
    S.ph.res={name:String(r.name||"Plato de la foto").slice(0,80),portion:String(r.portion||"").slice(0,80),items:(Array.isArray(r.items)?r.items:[]).slice(0,8).map(x=>({n:String(x.n||"").slice(0,40),g:Math.round(+x.g||0)})).filter(x=>x.n),P,C,F,conf:String(r.confidence||"media")};
  }catch(e){if(S.ph&&S.ph.mid===mid)S.ph.err=sampleMsg(e)||"No he podido analizar la foto."}
  if(S.ph&&S.ph.mid===mid)S.ph.busy=false;render();
}

    ${p.ask?`<div class="ph-ask"><input id="ph_hint" placeholder="¿Qué es? p. ej. lentejas con chorizo" value="${esc(p.hint||"")}" aria-label="Qué es el plato"><button class="btn sm" data-ph="hint">Recalcular</button></div>`:""}

const BW_EX=new Set(["dom","chin","fond"]);
function setVal(ex,s){const bw=num((S.profile||{}).weight)||75,w=+s.w||0,r=+s.r||0;if(!r)return 0;if(BW_EX.has(ex))return(bw+w)*(1+r/30);if(w)return w*(1+r/30);return r}
function sessVal(x,ex){const ss=x.sets&&x.sets[ex];if(!ss)return null;const v=Math.max(0,...ss.map(s=>setVal(ex,s)));return v>0?v:null}
function exUnit(ex){if(ex==="all")return"%";if(BW_EX.has(ex))return"kg";const any=S.str.some(x=>(x.sets&&x.sets[ex]||[]).some(s=>+s.w));return any?"kg":"rep"}
function strengthSeries(sel){
  const ss=S.str.slice().sort((a,b)=>a.date<b.date?-1:1);
  if(sel!=="all")return ss.map(x=>({d:x.date,v:sessVal(x,sel)})).filter(p=>p.v);
  const base={},pts=[];
  ss.forEach(x=>{const vals=[];Object.keys(x.sets||{}).forEach(ex=>{const v=sessVal(x,ex);if(!v)return;if(!base[ex])base[ex]=v;vals.push(v/base[ex]*100)});
    if(vals.length){const v=vals.reduce((a,b)=>a+b,0)/vals.length;const prev=pts.find(p=>p.d===x.date);if(prev)prev.v=(prev.v+v)/2;else pts.push({d:x.date,v})}});
  /* suaviza A/B alternas con media móvil de 2 sesiones */
  return pts.map((p,i)=>({d:p.d,v:i?(p.v+pts[i-1].v)/2:p.v}));
}
function strengthProj(pts){
  const last=pts[pts.length-1];let rate=1.5;
  if(pts.length>=3){const r=linreg(pts.map(p=>[daysBetween(pts[0].d,p.d)/7,p.v]));if(r&&isFinite(r.m))rate=r.m/last.v*100}
  rate=Math.min(3,Math.max(.5,rate));const tau=10;
  const f=(rt,t)=>last.v*(1+rt/100*tau*(1-Math.exp(-t/tau)));
  const out=[];for(let t=0;t<=12;t++)out.push({d:shiftKey(last.d,t*7),v:f(rate,t),lo:f(rate*.6,t),hi:f(rate*1.4,t)});
  return{rate,pts:out};
}
function strengthChart(pts,pr,unit){
  const w=400,h=190,PL=36,PR=8,PB=20,PT=14,iw=w-PL-PR,ih=h-PB-PT;
  const d0=pts[0].d,d1=pr.pts[pr.pts.length-1].d,span=Math.max(1,daysBetween(d0,d1));
  const all=pts.map(p=>p.v).concat(pr.pts.map(p=>p.hi),pr.pts.map(p=>p.lo));let lo=Math.min(...all),hi=Math.max(...all);const pd=(hi-lo)*.12||5;lo-=pd;hi+=pd;
  const X=d=>PL+daysBetween(d0,d)/span*iw,Y=v=>PT+ih-(v-lo)/(hi-lo)*ih;
  const fmt=v=>unit==="%"?fmtInt(v):unit==="kg"?fmtInt(v)+" kg":fmtInt(v);
  const line=pts.map((p,i)=>(i?"L":"M")+X(p.d).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const area=line+`L${X(pts[pts.length-1].d).toFixed(1)} ${PT+ih} L${X(d0).toFixed(1)} ${PT+ih} Z`;
  const band=pr.pts.map((p,i)=>(i?"L":"M")+X(p.d).toFixed(1)+" "+Y(p.hi).toFixed(1)).join(" ")+" "+pr.pts.slice().reverse().map(p=>"L"+X(p.d).toFixed(1)+" "+Y(p.lo).toFixed(1)).join(" ")+" Z";
  const proj=pr.pts.map((p,i)=>(i?"L":"M")+X(p.d).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const end=pr.pts[pr.pts.length-1],tx=X(pts[pts.length-1].d);
  const ticks=[lo+pd,hi-pd].map(v=>`<line x1="${PL}" x2="${w-PR}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" class="wg"/><text class="ax" x="${PL-5}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`).join("");

  <defs><linearGradient id="sga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5b2e" stop-opacity=".34"/><stop offset="1" stop-color="#ff5b2e" stop-opacity="0"/></linearGradient></defs>
  ${ticks}<rect x="${tx.toFixed(1)}" y="${PT-4}" width="${(w-PR-tx).toFixed(1)}" height="${ih+4}" class="ffut"/>

  ${pts.map((p,i)=>`<circle cx="${X(p.d).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i===pts.length-1?4.5:7}" fill="${i===pts.length-1?"#ff5b2e":"transparent"}" class="tipdot${i===pts.length-1?" wlast":" sdot-h"}" data-tip="${esc(dateLabel(p.d))}|${fmt(p.v)}"/>`).join("")}

function menuMicros(k){

/* ---------- Mover entrenos en Plan: mantener pulsado, arrastrar a otro día y soltar ---------- */
(function(){const HOLD=280;let cand=null,drag=null,timer=null,auto=null;
  const pt=e=>e.touches&&e.touches[0]?e.touches[0]:e.changedTouches&&e.changedTouches[0]?e.changedTouches[0]:e;
  const rowAt=(x,y)=>{if(drag)drag.ghost.style.display="none";const el=document.elementFromPoint(x,y);if(drag)drag.ghost.style.display="";const r=el&&el.closest(".trow[data-trow]");return r&&r.dataset.trow>=today()?r:null};
  function start(e){const row=e.target.closest&&e.target.closest("[data-pmove]");if(!row||e.target.closest("button,a,input,select"))return;
    const p=pt(e);cand={row,x:p.clientX,y:p.clientY};clearTimeout(timer);timer=setTimeout(()=>lift(),HOLD)}
  function lift(){if(!cand)return;const r=cand.row.getBoundingClientRect(),g=cand.row.cloneNode(true);
    g.classList.add("pm-ghost");g.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;z-index:95;pointer-events:none`;document.body.appendChild(g);
    cand.row.classList.add("pm-src");drag={row:cand.row,ghost:g,dx:cand.x-r.left,dy:cand.y-r.top,from:cand.row.dataset.pmove,over:null};cand=null;
    try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}}
  function move(e){const p=pt(e);
    if(cand&&!drag){if(Math.hypot(p.clientX-cand.x,p.clientY-cand.y)>8){clearTimeout(timer);cand=null}return}
    if(!drag)return;if(e.cancelable)e.preventDefault();
    drag.ghost.style.left=(p.clientX-drag.dx)+"px";drag.ghost.style.top=(p.clientY-drag.dy)+"px";
    const r=rowAt(p.clientX,p.clientY);if(r!==drag.over){if(drag.over)drag.over.classList.remove("pm-over");if(r)r.classList.add("pm-over");drag.over=r}
    clearInterval(auto);const v=p.clientY<90?-12:p.clientY>innerHeight-130?12:0;if(v)auto=setInterval(()=>window.scrollBy(0,v),16)}
  function end(){clearTimeout(timer);clearInterval(auto);cand=null;if(!drag)return;const d=drag;drag=null;d.ghost.remove();d.row.classList.remove("pm-src");
    if(!d.over)return;d.over.classList.remove("pm-over");const[k,i]=d.from.split("|"),to=d.over.dataset.trow;if(to===k)return;
    S.plan=S.plan||{};const prev=JSON.parse(JSON.stringify(S.plan)),it=(S.plan[k]||[]).splice(+i,1)[0];if(!it)return;
    if(!S.plan[k].length)delete S.plan[k];(S.plan[to]=S.plan[to]||[]).push(it);savePlan();render();
    undoToast(`${sessName(it)} movido al ${dateLabel(to)}`,()=>{S.plan=prev;savePlan();render()})}
  document.addEventListener("touchstart",start,{passive:true});document.addEventListener("touchmove",move,{passive:false});
  document.addEventListener("touchend",end);document.addEventListener("touchcancel",end);
  document.addEventListener("mousedown",e=>{if(e.button===0)start(e)});document.addEventListener("mousemove",move);document.addEventListener("mouseup",end);
  document.addEventListener("contextmenu",e=>{if(e.target.closest&&e.target.closest("[data-pmove]"))e.preventDefault()});
})();

    if(m&&!el.querySelector("small")){h=`${m[1]} <small class="u">h</small>`+(m[2]?` ${m[2]} <small class="u">min</small>`:"");}

    if(h){const sp=document.createElement("span");sp.innerHTML=h;el.replaceChild(sp,n);sp.outerHTML=h}
    if(el.tagName==="B")el.querySelectorAll(":scope>small.u").forEach(x=>{const p=x.previousSibling;if(p&&p.nodeType===3)p.textContent=p.textContent.replace(/[\s\u00a0]+$/,"")})})}

/* Cómo llegas hoy (v203): anillos de equilibrio. Cada anillo es un factor; su color nace en la semilla de arriba

const RG_MX={hrv:22,rhr:30,tsb:20,sleep:20},RGP={};

const rgVd=sc=>sc>=78?"#30d158":sc>=58?"color-mix(in srgb,#30d158 50%,var(--card))":sc>=38?"#ff9f0a":"#ff453a";
function rgItems(k){const r=readiness(k),F={};r.f.forEach(x=>F[x.k]=x);const o=(S.profile||{}).sex==="f"?"a":"o",sg=n=>n>0?"+":n<0?"−":"±",cv=x=>x&&x.c!=null?x.c:null;
  const H=S.hrv||{},hv=H[k],hp=[];for(let i=1;i<=7;i++){const x=H[shiftKey(k,-i)];if(x)hp.push(x)}const hb=hp.length>=3?hp.reduce((a,b)=>a+b,0)/hp.length:null,hpc=hv&&hb?Math.round((hv/hb-1)*100):null;
  const rv=(S.rhr||{})[k],base=rhrAvg(shiftKey(k,-1),7),dd=rv&&base?Math.round(rv-base):null,it=[];

    ph:F.hrv?{"Alta":"la VFC alta","Normal":"la VFC normal","Baja":"la VFC algo baja","Muy baja":"la VFC muy baja"}[F.hrv.v]||"":"",
    why:hpc!=null?`${Math.abs(hpc)} % ${hpc<0?"por debajo":"por encima"} de tu media de 7 días. ${cv(F.hrv)<0?"Baja con cansancio, estrés o mal sueño.":"Señal de buena recuperación."}`:"Con 3 noches registradas tendrás tu media."});
  const cr=cv(F.rhr);
  it.push({k:"rhr",l:"Pulso en reposo",has:!!rv,c:cr,v:rv||"—",u:rv?"ppm":"",sub:dd!=null?`${sg(dd)}${Math.abs(dd)} vs tu media`:rv?"En reposo":"Sin dato",
    ph:cr==null?"":cr>=10?"el pulso bajo":cr>0?"el pulso en tu media":cr>-20?"el pulso algo alto":"el pulso alto",
    why:dd==null?"Con unos días de datos tendrás tu media.":dd>3?"Algo alto: puede ser fatiga, calor o un catarro que empieza.":dd<=-3?"Más bajo que tu media: buena señal de recuperación.":"En tu media: el corazón no trabaja de más."});
  if(F.tsb){const c=F.tsb.c;it.push({k:"tsb",l:"Carga de entreno",has:true,c,v:F.tsb.v.charAt(0).toUpperCase()+F.tsb.v.slice(1),u:"",sub:"Frente a lo habitual",ph:c>0?"llegas fresc"+o:c<0?"llegas cargad"+o:"",
    why:c>0?"Días más suaves que tu media de semanas: tienes margen.":c<0?"Vienes de días más duros que tu media: aún los asimilas.":"Carga reciente parecida a la habitual."})}
  const sl=(S.sleep||{})[k];if(sl&&F.sleep)it.push({k:"sleep",l:"Sueño",has:true,c:F.sleep.c,v:F.sleep.v,u:"",sub:"Cómo has dormido",ph:{good:"has dormido bien",ok:"has dormido regular",bad:"has dormido mal"}[sl],
    why:{good:"Dormir bien es lo que más acelera la recuperación.",ok:"Una noche regular resta poco; si se repite, pesa.",bad:"Una mala noche baja la VFC y sube el pulso: tómatelo con calma."}[sl]});
  return{r,it}}
function rgWhy(it,fb){const L=a=>a.length<2?a.join(""):a.slice(0,-1).join(", ")+" y "+a[a.length-1],cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
  const neg=it.filter(x=>x.c<0&&x.ph).map(x=>x.ph),pos=it.filter(x=>x.c>0&&x.ph).map(x=>x.ph);
  if(neg.length)return`<b>${cap(L(neg))}</b> ${neg.length>1?"restan":"resta"}${pos.length?`, pero <b>${L(pos)}</b>`:""}.`;
  return pos.length?`A favor: <b>${L(pos)}</b>.`:esc(fb)}
function rgDayK(tk){return S.rgDay&&S.rgDay<tk&&S.rgDay>=shiftKey(tk,-6)?S.rgDay:tk}
function rgHint(){try{return!localStorage.getItem("sustrato-rghint")&&!S._rgHint}catch(e){return!S._rgHint}}

    <div class="rg-wk" role="group" aria-label="Cómo llegaste cada día">${wk}</div>`}
function rgRows(tk,hrvSpecial){const day=rgDayK(tk),{it}=rgItems(day),I=p=>`<svg class="wf-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  const IC={hrv:'<path d="M3 12h4l2-5 4 10 2-5h6"/>',rhr:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',tsb:'<path d="M4 18V12M9 18V8M14 18v-5M19 18V5"/>',sleep:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>'};

(function(){let g=null,x0=0,st=0,moved=false,sup=false;
