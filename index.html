.dnew.acc{background:var(--card)!important}
.dnew.acc h3::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--ac);margin-right:8px;vertical-align:1px}
/* sistema: una sola tipografía (cifras tabulares, sin monoespaciada) */
:root,html[data-theme]{--mono:var(--font)!important}
.mt,.ax,svg text{font-variant-numeric:tabular-nums}
/* sistema: sin bordes laterales de color; el color va en un punto junto al rótulo */
.rec::before{display:none!important}
.rec-l::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.ime{border-left:0!important}
.rh-t.ok,.rh-t.mid,.rh-t.hi{box-shadow:none!important}
.rh-t span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0;background:var(--faint)}
.rh-t.ok span::before{background:#30d158}.rh-t.mid span::before{background:#ff9f0a}.rh-t.hi span::before{background:#ff453a}
.wc-chip.ok,.wc-chip.mid,.wc-chip.hi,.rd-c.ok,.rd-c.mid,.rd-c.hi{box-shadow:none!important}
/* pulso: escala con rótulos debajo, sin pisar el texto */
.rh-bar{height:10px!important;margin-top:4px}
.rh-bar em{inset:auto 0 auto 0!important;top:16px!important;font-weight:500!important;font-size:12px!important;color:var(--muted)!important}
.rh-bar i{top:-5px!important;bottom:-5px!important}
.rh-scale{padding-bottom:22px}
/* fuerza: el nombre de la rutina es titular de página */
.fz-title h2{font-size:28px!important;font-weight:700!important;letter-spacing:-.025em!important}

/* sistema: etiquetas sin "píldora tintada". Fondo neutro, texto normal y el color en un punto. */
html[data-theme] .badge{background:var(--card2,rgba(127,127,127,.14))!important;color:var(--fg)!important;text-transform:none!important;letter-spacing:0!important;font-weight:500!important;font-size:13px!important;display:inline-flex!important;align-items:center;justify-content:flex-start!important;gap:6px;padding:0 0 0 9px!important;height:24px;line-height:24px;border-radius:6px!important;text-align:left!important;outline:0!important;box-shadow:none!important}
html[data-theme] .badge::before{content:"";flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--bc,var(--faint))}
.b-run{--bc:#ffd21e}.b-trail{--bc:#ff9f0a}.b-mtb{--bc:#3b82f6}.b-str{--bc:#ff5b2e}.b-walk{--bc:#30d158}.b-hike{--bc:#5ac8fa}.b-rest{--bc:var(--faint)}
html[data-theme] .badge.dashed{background:transparent!important;box-shadow:inset 0 0 0 1px var(--sep,rgba(127,127,127,.35))!important}
html[data-theme] .badge.dashed::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--bc)}
html[data-theme] .pill.tag-pre,html[data-theme] .pill.tag-post,html[data-theme] .pill.tag-load{background:var(--card2,rgba(127,127,127,.14))!important;color:var(--fg)!important;border:0!important;font-weight:500}
.pill.tag-pre::before,.pill.tag-post::before,.pill.tag-load::before{content:"";width:6px;height:6px;border-radius:50%;flex:0 0 auto}
.pill.tag-pre::before{background:#ff9f0a}.pill.tag-post::before{background:#3b82f6}.pill.tag-load::before{background:#bf5af2}
html[data-theme] .ev{background:none!important;color:var(--muted)!important;padding:0!important;font-weight:500!important;font-size:13px!important;display:inline-flex;align-items:center;gap:7px}
.ev::before{content:"";width:17px;height:9px;border-radius:1px;background:linear-gradient(90deg,var(--e1) 0 3px,transparent 3px 4.67px,var(--e2) 4.67px 7.67px,transparent 7.67px 9.33px,var(--e3) 9.33px 12.33px,transparent 12.33px 14px,var(--e4) 14px 17px)}
.ev{--on:var(--fg);--off:color-mix(in srgb,var(--fg) 20%,transparent)}
.ev-hi{--e1:var(--on);--e2:var(--on);--e3:var(--on);--e4:var(--on)}
.ev-mh{--e1:var(--on);--e2:var(--on);--e3:var(--on);--e4:var(--off)}
.ev-md{--e1:var(--on);--e2:var(--on);--e3:var(--off);--e4:var(--off)}
.ev-lo{--e1:var(--on);--e2:var(--off);--e3:var(--off);--e4:var(--off)}
html[data-theme] .pst{background:var(--card2,rgba(127,127,127,.14))!important;color:var(--fg)!important;font-weight:500!important}
.pst.ok::before{color:#30d158}.pst.chg::before{color:#ff9f0a}.pst.miss::before{content:"✕";color:#ff453a}.pst.skip::before{content:"–";color:var(--faint)}

/* sistema: variaciones como texto con flecha, sin píldora tintada */
html[data-theme] .ppill{background:none!important;padding:0!important;font-weight:600!important;color:var(--fg)!important}
.ppill.good{color:#1f9d4a!important}.ppill.bad{color:#c2410c!important}
html[data-theme="dark"] .ppill.good{color:#30d158!important}html[data-theme="dark"] .ppill.bad{color:#ff9f0a!important}
.frace-box{border-left:0!important}
.frace-box b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffd21e;margin-right:7px;vertical-align:1px}
/* antetítulo + título: el primero baja a rótulo */
div:has(> .pkk + h2) > .pkk{font-size:13px!important;font-weight:500!important;color:var(--muted)!important}

.dl-act{display:flex;gap:4px;flex:0 0 auto}
.dl-ib{appearance:none;width:38px;height:38px;border-radius:10px;border:0;background:var(--card2,rgba(127,127,127,.12));color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:background .18s,color .18s}
.dl-ib:hover{color:var(--fg)}
.dl-ib[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.dl-m{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.dl-bar{display:flex;gap:2px;height:4px;margin-top:6px;max-width:160px;border-radius:2px;overflow:hidden}
.dl-bar i{display:block;height:100%}

.wc-slrow{flex-wrap:wrap}
.wc-slrow .wc-l{flex:0 0 auto;overflow:visible!important;text-overflow:clip!important}
.wc-slrow .wc-sl{flex:1 1 200px;min-width:0}
.wc-slrow .wc-sl button{flex:1;padding:0 6px}

/* copia de seguridad */
.bk-a{display:flex;gap:8px;flex-wrap:wrap}
.bk-a .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1 1 140px}
.bk-up{position:relative;cursor:pointer;background:var(--card2,rgba(127,127,127,.14))!important;color:var(--fg)!important}
.bk-up input{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;cursor:pointer}
.bk-up.off{opacity:.45;pointer-events:none}
.bk-conf{padding:12px;border-radius:14px;background:color-mix(in srgb,#ff9f0a 10%,transparent);display:flex;flex-direction:column;gap:10px}
.bk-conf p{margin:0;font-size:14px;line-height:1.45}

/* recuperación */
.rc-h{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.rc-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#30d158;background:color-mix(in srgb,#30d158 15%,transparent)}
html[data-theme="light"] .rc-ic{color:#15803d}
.rc-h h2{margin:0!important}.rc-h p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.rc-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-top:14px}
.rc-k div{padding:10px 12px;border-radius:14px;background:var(--card2,rgba(127,127,127,.12));display:grid;grid-template-columns:auto 1fr;column-gap:7px;align-items:baseline}
.rc-k i{width:8px;height:8px;border-radius:50%;align-self:center}
.rc-k b{font-size:20px;font-variant-numeric:tabular-nums}
.rc-k span{grid-column:2;font-size:12px;color:var(--muted)}
.rc-s{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.rc-s>span{font-size:13px;color:var(--muted)}
.rc-d{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:8px 0;border-top:.5px solid var(--sep,var(--edge-soft))}
.rc-d b{font-size:15px;font-weight:600}.rc-d small{font-size:12px;color:var(--muted);white-space:nowrap}

/* resumen semanal */
.ws-p{margin:2px 0 14px;font-size:14px;color:var(--muted)}
.pnav.sm{display:flex;gap:4px}
.ws-bar{display:flex;gap:2px;height:10px;border-radius:6px;overflow:hidden}
.ws-bar i{display:block;height:100%}
.ws-lg{display:flex;flex-wrap:wrap;gap:4px 12px;margin:8px 0 16px;font-size:12px;color:var(--muted)}
.ws-lg span{display:flex;align-items:center;gap:5px}.ws-lg i{width:7px;height:7px;border-radius:50%}
.ws-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ws-g>div{padding:10px 12px;border-radius:14px;background:var(--card2,rgba(127,127,127,.12));display:flex;flex-direction:column;gap:2px;min-width:0}
.ws-g span{font-size:12px;color:var(--muted)}
.ws-g b{font-size:20px;font-variant-numeric:tabular-nums}.ws-g b small{font-size:12px;color:var(--muted);font-weight:500}
.ws-g .ws-na{font-size:12px;color:var(--faint)}
.ws-g em{font-style:normal;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.ws-g em.nt{color:var(--muted)}.ws-g em.up{color:#1f9d4a}.ws-g em.dn{color:#c2410c}
html[data-theme="dark"] .ws-g em.up{color:#30d158}html[data-theme="dark"] .ws-g em.dn{color:#ff9f0a}
.ws-hl{display:flex;align-items:center;gap:8px;margin:14px 0 12px;font-size:14px}
.ws-star{width:24px;height:24px;border-radius:10px;display:grid;place-items:center;color:#ffd21e;background:color-mix(in srgb,#ffd21e 18%,transparent);flex:0 0 auto}
html[data-theme="light"] .ws-star{color:#a16207}
.ws-tease{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ws-tease p{margin:4px 0 0;font-size:14px;color:var(--muted)}

/* avituallamiento real */
.fl-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.fl-list li{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;font-size:15px}
.fl-list li i{width:9px;height:9px;border-radius:50%}
.fl-list li b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted)}
.fl-done .sw-h{align-items:center}
.fl-ask{display:flex;flex-direction:column;gap:16px}
.fl-ask-h{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.fl-ask-h h2{margin:4px 0 0!important;font-size:20px!important;line-height:1.25}
.fl-ask-h p{margin:6px 0 0;font-size:14px;color:var(--muted);line-height:1.45}
.fl-ask-a{display:flex;gap:10px;align-items:center}.fl-ask-a .btn{flex:1}
.fl-box{margin-top:20px;padding:14px;border-radius:14px;background:var(--card2,rgba(127,127,127,.12));display:flex;flex-direction:column;gap:12px}
.fl-ic{color:#ffd21e!important;background:color-mix(in srgb,#ffd21e 18%,transparent)!important}
html[data-theme="light"] .fl-ic{color:#a16207!important}
.fl-items{display:flex;flex-direction:column;gap:2px}
.fl-it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.fl-it>span{display:flex;flex-direction:column;min-width:0}.fl-it b{font-size:14px;font-weight:600}.fl-it small{font-size:12px;color:var(--muted)}
.fl-ex{width:96px}
.fl-cmp{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.fl-cmp span{display:block;font-size:12px;color:var(--muted)}.fl-cmp b{font-size:15px;font-variant-numeric:tabular-nums}
.fl-cmp>div:last-child{text-align:right}
.fl-track{position:relative;height:8px;border-radius:4px;background:color-mix(in srgb,var(--fg) 10%,transparent)}
.fl-track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:#ffd21e}
.fl-track em{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--fg);border-radius:1px}
.fl-gi{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;font-weight:600}
.fl-sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.fl-sum>div{padding:10px 12px;border-radius:14px;background:var(--card2,rgba(127,127,127,.12))}
.fl-sum span{display:block;font-size:12px;color:var(--muted)}.fl-sum b{font-size:20px;font-variant-numeric:tabular-nums}.fl-sum b small{font-size:12px;color:var(--muted)}
.fl-ch{display:block;width:100%;height:auto}
.fl-warn{margin:8px 0 0!important;padding:10px;border-radius:14px;background:color-mix(in srgb,#ff9f0a 10%,transparent);font-size:13px!important}

/* avituallamiento: despensa */
.fl-it{display:grid!important;grid-template-columns:8px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0!important;border-top:.5px solid var(--sep,var(--edge-soft))}
.fl-items .fl-it:first-child{border-top:0}
.fl-dot{width:8px;height:8px;border-radius:50%}
.fl-nm{display:flex;flex-direction:column;min-width:0}.fl-nm b{font-size:14px;font-weight:600}.fl-nm small{font-size:12px;color:var(--muted)}
.fl-add{display:flex;flex-direction:column;gap:8px}
.fl-lbl{font-size:13px;font-weight:600;color:var(--muted)}
.fl-chips{display:flex;flex-wrap:wrap;gap:6px}
.fl-chip{appearance:none;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:0 12px;min-height:34px;background:var(--bg);color:var(--fg);font:500 14px var(--font);cursor:pointer}
html[data-theme="light"] .fl-chip{background:#fff}
.fl-chip i{width:7px;height:7px;border-radius:50%}
.fl-new,.fl-more{color:var(--muted)}.fl-more{text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--muted) 40%,transparent)}
.fl-form{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:14px;background:var(--bg)}
html[data-theme="light"] .fl-form{background:#fff}
.fl-form .sw-in input,.fl-form input{background:var(--card2,rgba(127,127,127,.12))!important}
.fl-wide input{min-height:42px;padding:0 12px;font-size:15px}
.fl-f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.fl-f .seg{display:flex}.fl-f .seg button{flex:1}
.fl-tot{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.fl-kvs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fl-kv{padding:8px 10px;border-radius:14px;background:var(--bg)}
html[data-theme="light"] .fl-kv{background:#fff}
.fl-kv span{display:block;font-size:12px;color:var(--muted)}.fl-kv b{font-size:15px;font-variant-numeric:tabular-nums}.fl-kv small{display:block;font-size:12px;color:var(--muted)}

/* editor de rutinas */
.app-ver{margin:28px 0 8px;text-align:center;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.re-sheet{display:flex;flex-direction:column;gap:16px}
.re-sheet>*,.rw-sheet>*{flex-shrink:0}
.re-name{appearance:none;border:0!important;background:none!important;padding:0!important;min-height:0!important;color:var(--fg);font:700 26px/1.15 var(--font)!important;letter-spacing:-.02em;width:100%;height:auto!important}
.re-name::placeholder{color:var(--faint)}
.re-name:focus{outline:none;box-shadow:none!important}
.re-sum{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;padding:14px;border-radius:20px;background:var(--card2);--fig-ground:var(--card2)}
.re-sum .fig{height:110px}
.re-sum b{display:block;font-size:20px}.re-sum span{display:block;font-size:14px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.re-sum p{margin:8px 0 0;font-size:14px;line-height:1.4}
.re-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.re-it{padding:14px;border-radius:20px;background:var(--card2);display:flex;flex-direction:column;gap:10px}
.re-n{min-width:0}.re-n b{display:block;font-size:17px;font-weight:600}.re-n span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.re-sr{display:flex;align-items:center;gap:8px}
.re-sr label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.re-sr input{width:48px;min-height:38px!important;padding:0 8px!important;text-align:center;font-size:17px!important;font-weight:600;font-variant-numeric:tabular-nums;background:var(--card)!important;border:0!important;border-radius:10px!important}
.re-sr label.w{flex:1}.re-sr label.w input{width:100%;min-width:0}
.re-top{display:flex;align-items:flex-start;gap:8px}.re-top .re-n{flex:1}
.re-x{color:var(--faint)}
.re-ia{display:flex;gap:2px;margin:-6px -6px 0 0}
.re-ia button{appearance:none;border:0;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:transparent;color:var(--muted);cursor:pointer}
.re-ia button:hover:not(:disabled){background:var(--card);color:var(--fg)}
.re-ia button:disabled{opacity:.3;cursor:default}
.re-addh h3{margin:6px 0 0;font-size:17px;font-weight:600}
.re-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent)}
.re-tabs::-webkit-scrollbar{display:none}
.re-tabs button{appearance:none;border:0;flex:0 0 auto;min-height:38px;padding:0 14px;border-radius:14px;background:transparent;color:var(--muted);font:500 15px var(--font);cursor:pointer;transition:background .18s,color .18s}
.re-tabs button[aria-selected="true"]{background:var(--fig-on);color:#fff;font-weight:600}
.re-lib{list-style:none;margin:0;padding:0;border-radius:20px;background:var(--card2);overflow:hidden}
.re-lib li{display:flex;align-items:center;gap:12px;padding:12px 14px}

.re-lib .re-n{flex:1}
.re-add{appearance:none;border:0;flex:0 0 auto;width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--card);color:var(--fg);cursor:pointer;transition:background .18s,transform .12s}
.re-add.on{background:var(--fig-on);color:#fff}
.re-add:active{transform:scale(.92)}
.re-custom{display:flex;gap:8px}.re-custom input{flex:1}
.re-foot{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:4px}.re-foot .btn{flex:1}
/* plato rápido */
.pb-sum{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:14px 16px;border-radius:20px;background:var(--card2)}
.pb-k b{display:block;font:700 28px/1 var(--font);letter-spacing:-.02em;font-variant-numeric:tabular-nums}.pb-k span{font-size:13px;color:var(--muted)}
.pb-m{display:flex;flex-direction:column;gap:8px;min-width:0}
.pb-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--fill)}
.pb-mv{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pb-mv span{display:inline-flex;align-items:center;gap:5px}.pb-mv i{width:8px;height:8px;border-radius:50%}
.pb-empty{margin:0;padding:14px;border-radius:14px;border:1.5px dashed var(--sep);color:var(--muted);font-size:14px;line-height:1.4}
.pb-it .re-top{align-items:center}
.pb-st{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:14px;padding:2px}
.pb-st button{appearance:none;border:0;width:34px;height:34px;border-radius:10px;background:none;color:var(--fg);font:500 20px var(--font);cursor:pointer}
.pb-st b{min-width:26px;text-align:center;font-size:15px;font-variant-numeric:tabular-nums}
.pb-meals{display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:600}
.pb-seg{width:100%}.pb-seg button[aria-pressed="true"]{background:var(--fill);color:var(--fg);font-weight:600}
html[data-theme="light"] .pb-seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pb-sheet>*{flex-shrink:0}
.pf-save{display:inline-flex;align-items:center;gap:6px;transition:background .25s,color .25s,opacity .2s}
.pf-save:disabled{opacity:.4;cursor:default}
.pf-save.done,.pf-save.done:disabled{opacity:1;background:var(--ok,#30d158)!important;color:#062b10!important}
/* asistente de rutinas */
:root{--fig-base:#3a3a3e;--fig-on:#ff6a3d;--fig-sec:rgba(255,106,61,.42)}
html[data-theme="light"]{--fig-base:#d6d6db;--fig-on:#f0541f;--fig-sec:rgba(240,84,31,.38)}
.fig{display:flex;gap:6px;align-items:center;justify-content:center}
.fig svg{height:100%;width:auto;display:block}
.fig path{stroke:var(--fig-ground,var(--card2));stroke-width:1.6;stroke-linejoin:round}
.rw-sheet{display:flex;flex-direction:column;gap:18px}
.rw-hd{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;text-align:center;font-size:15px;font-weight:600;color:var(--muted)}
.rw-sheet h2.rw-h{margin:-6px 0 0!important;font-size:28px!important;line-height:1.12;letter-spacing:-.02em;font-weight:700}
.rw-sub{margin:-10px 0 0;font-size:15px;color:var(--muted);line-height:1.4}
.rw-goals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.rw-goal{appearance:none;border:0;border-radius:14px;padding:12px 4px 10px;min-height:78px;background:var(--card2);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;cursor:pointer;font:inherit;transition:background .18s,color .18s,transform .12s}
.rw-goal b{font-size:13px;font-weight:600;line-height:1.1}
.rw-goal[aria-checked="true"]{background:var(--fg);color:var(--bg)}
.rw-goal:active{transform:scale(.98)}
.rw-time{display:flex;flex-direction:column;gap:10px}
.rw-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;font-weight:600}
.rw-seg{display:flex;background:var(--card2);border-radius:14px;padding:3px;gap:3px;width:min(240px,62%)}
.rw-seg button{flex:1;appearance:none;border:0;border-radius:10px;min-height:38px;background:transparent;color:var(--muted);font:500 15px var(--font);cursor:pointer}
.rw-seg button[aria-checked="true"]{background:var(--fill);color:var(--fg);font-weight:600}
html[data-theme="light"] .rw-seg button[aria-checked="true"]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rw-lbl{margin-top:4px}
.rw-list{display:flex;flex-direction:column;gap:12px}
.rw-card{background:var(--card2);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;--fig-ground:var(--card2)}
.rw-top{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:14px;align-items:start}
.rw-top .fig{height:128px}
.rw-sheet .rw-tx h3{margin:0;font-size:20px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.rw-meta{display:block;margin-top:4px;font-size:14px;color:var(--muted)}
.rw-tx p{margin:8px 0 0;font-size:14px;line-height:1.42;color:var(--fg);opacity:.86}
.rw-ex{list-style:none;margin:0;padding:0;border-radius:14px;overflow:hidden;background:var(--card)}
.rw-ex li{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;font-size:15px}
.rw-ex li:nth-child(even){background:var(--fill2)}
.rw-ex b{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rw-more button{appearance:none;border:0;background:none;padding:0;color:var(--muted);font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.rw-act{display:flex;gap:10px}.rw-act .btn{flex:1}
.rw-scratch{appearance:none;border:0;background:none;color:var(--fg);font:600 15px var(--font);min-height:48px;text-decoration:underline;text-underline-offset:4px;cursor:pointer}

/* tarjeta de la mañana: neutra; el color solo lo pone el veredicto (--vc) */
.wc-ro{cursor:default}
.wcard{--wc-tx:var(--fg);--wc-mu:var(--muted);--wc-tile:var(--card2);--wc-in:var(--fill)}
.wcard h3,.wc-h h3,.wc-hd h3,.wc-v h3,.wc-rdh h4,.wc-sc,.wc-big,.wc-st,.wc-chip b,.wc-foot,.wc-clash{color:var(--wc-tx)!important}
.wc-h span,.wc-hd span,.wc-l,.wc-e,.wc-sec,.wc-f small,.wc-big i,.wc-in i,.wc-chip small,.wc-hero .wc-fx,.wc-fx,.wc-v p,.wc-rd p{color:var(--wc-mu)!important}
.wc-adv{color:var(--wc-tx)!important;opacity:.86}
.wc-f,.wc-slrow,.wc-chip,.wc-rd:not(.wc-hero),.wc-clash{background:var(--wc-tile)!important}
.wc-in input{background:var(--wc-in)!important;color:var(--wc-tx)!important}
.wc-in input::placeholder{color:var(--faint)!important}
.wc-in input:focus,.wc-p .wc-in input:focus{background:var(--fill)!important;box-shadow:0 0 0 2px var(--fg) inset!important}
.wc-p .wc-in input{background:var(--wc-in)!important}
.wc-big em{color:var(--wc-tx)!important;border-color:var(--sep)!important}
.wc-w .wc-ic{background:color-mix(in srgb,#bf5af2 20%,transparent)!important;color:#bf5af2!important}
.wc-p .wc-ic{background:color-mix(in srgb,#ff375f 18%,transparent)!important;color:#ff375f!important}
.wc-ics{background:color-mix(in srgb,#5b6cff 20%,transparent)!important;color:#7d8bff!important}
.wc-save{background:var(--fg)!important;color:var(--bg)!important}
.wc-skip{color:var(--wc-tx)!important}.wc-skip:hover{background:var(--fill)!important}
.wc-hd .wc-edit{background:var(--card2)!important;color:var(--wc-tx)!important}
.wc-btn{background:var(--fg)!important;color:var(--bg)!important}
.wc-sl,.wc-slrow .wc-sl{background:var(--fill)!important}
.wc-sl button{color:var(--wc-tx)!important}
.wc-sl button[aria-checked="true"],.wc-sl button[aria-pressed="true"]{background:var(--fg)!important;color:var(--bg)!important}
.wc-hero .wc-sc{color:var(--vc,var(--fg))!important}
.wc-meter{background:var(--fill)!important}
.wc-hero .wc-meter i{background:var(--vc,var(--fg))!important}
html[data-theme="light"] .wc-hero .wc-sc{color:color-mix(in srgb,var(--vc,#1c1c1e) 70%,#000)!important}
html[data-theme="light"] .wc-w .wc-ic{color:#8e2fc4!important}
html[data-theme="light"] .wc-p .wc-ic{color:#d70f3c!important}
html[data-theme="light"] .wc-ics{color:#3b4bd8!important}
.pa-row{display:flex;flex-direction:column;gap:8px;margin-top:12px}.pa-row .btn{width:100%;margin:0!important}
.mfreq{display:flex;flex-direction:column;gap:6px;margin:10px 0 4px}
.mfreq>span{font-size:13px;color:var(--muted)}
.mfq{appearance:none;border:0;text-align:left;font:inherit;color:var(--fg);background:var(--card2,rgba(127,127,127,.12));border-radius:14px;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mfq b{font-weight:600;font-size:14px}.mfq small{color:var(--muted);font-size:12px;white-space:nowrap}
.mfq:active{transform:scale(.98)}
.wc-hv{flex-wrap:wrap}
.wc-hvv{flex:1;text-align:right;font-variant-numeric:tabular-nums;color:var(--wc-mu)}
.wc-hvv b{font:650 20px var(--round,var(--font));color:var(--wc-tx)}.wc-hvv small{font-size:13px}
.wc-hvin{position:relative;flex:1;min-width:90px;max-width:140px;margin-left:auto}
.wc-hvin input{width:100%;min-height:40px;padding:0 34px 0 12px;border:0;border-radius:10px;background:var(--wc-in,var(--fill));color:var(--wc-tx,var(--fg));font:600 17px var(--font);font-variant-numeric:tabular-nums}
.wc-hvin i{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px;color:var(--wc-mu,var(--muted))}
.wc-hvn{flex-basis:100%;font-size:13px;color:var(--wc-mu,var(--muted))}
.mtags{display:flex!important;flex-direction:row!important;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 4px 36px}.mtags .pill{flex:0 0 auto;width:auto!important}
.meal .mh .tags{flex:0 1 auto;min-width:0}
/* foto de comida */
.mcam{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;color:var(--fg);cursor:pointer;flex:0 0 auto}
.mcam:active{background:var(--fill)}
.mphoto{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;margin-top:10px;border-radius:14px;background:var(--fg);color:var(--bg);font:600 15px var(--font);cursor:pointer}
.mphoto:active{transform:scale(.98)}
.ph{margin-top:10px;padding:12px;border-radius:14px;background:var(--card2,rgba(127,127,127,.12))}
.ph-top{display:flex;gap:12px;align-items:flex-start}
.ph-img{flex:0 0 64px;width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--fill)}
.ph-tx{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.ph-tx b{font-size:15px;line-height:1.25}.ph-tx small{font-size:13px;color:var(--muted);line-height:1.35}
.ph-it{color:var(--fg)!important;opacity:.8}
.ph-sh{display:block;height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin:4px 0}
.ph-sh i{display:block;height:100%;width:40%;border-radius:3px;background:var(--faint);animation:phsh 1.1s ease-in-out infinite}
@keyframes phsh{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.ph-mac{display:flex;gap:14px;align-items:baseline;margin:12px 0 8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ph-mac b{font:650 24px var(--round,var(--font));color:var(--fg)}
.ph-r{display:flex;gap:6px;flex-wrap:wrap}
.ph-ask{display:flex;gap:8px;margin-top:10px}.ph-ask input{flex:1;min-width:0}
.ph-a{display:flex;gap:8px;align-items:center;margin-top:12px}.ph-a .btn.primary{flex:1;min-height:42px}
.ph-x{appearance:none;border:0;background:none;color:var(--muted);font:500 14px var(--font);padding:8px;cursor:pointer;margin-left:auto}
.lgph{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;margin-top:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lgph span:first-child{color:var(--fg);font-weight:600;flex-basis:100%}
.lgph .ph-x{padding:4px 0}
.mwhy{display:flex;align-items:flex-start;gap:4px;margin:0 0 8px 36px;font-size:14px;color:var(--muted);line-height:1.3}
.mwhy i{flex:0 0 7px;width:7px;height:7px;border-radius:50%;margin-top:6px}.mwhy span{margin-left:4px}
.sv-ok{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}.sv-ok::before{content:"";width:7px;height:7px;border-radius:50%;background:#30d158}
/* ruta */
.rblock{margin:0 0 18px}
.rmap{position:relative;width:100%;aspect-ratio:360/230;border-radius:14px;overflow:hidden;background:var(--fill)}
.rmap img{position:absolute;max-width:none;filter:grayscale(1) contrast(.92) brightness(1.04)}
html[data-theme="dark"] .rmap img{filter:grayscale(1) invert(1) contrast(.85) brightness(.9)}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]) .rmap img{filter:grayscale(1) invert(1) contrast(.85) brightness(.9)}}
.rmap svg{position:absolute;inset:0;width:100%;height:100%}
.rm-halo{fill:none;stroke:var(--bg,#fff);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.85;vector-effect:non-scaling-stroke}
.rm-line{fill:none;stroke:#ff5b2e;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.rm-start{fill:#30d158;stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}.rm-end{fill:#1c1c1e;stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
.rm-attr{position:absolute;right:6px;bottom:4px;font-size:11px;color:#333;background:rgba(255,255,255,.7);padding:1px 5px;border-radius:4px}
.relev{margin-top:12px}.relev svg{display:block;width:100%;height:96px;margin:4px 0}
.re-area{fill:var(--fill)}.re-line{fill:none;stroke:var(--fg);stroke-width:1.8;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.rm-strava{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;color:#fc5200;text-decoration:none}
/* v127 armonía: color solo con significado, en la línea o en un punto */
.fl-ask .fl-ic{background:var(--card2,rgba(127,127,127,.12))!important;color:var(--fg)!important}
.fl-ask-a{align-items:stretch!important}.fl-ask-a>*{min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.wc-ic,.wc-w .wc-ic,.wc-p .wc-ic,.wc-ics,html[data-theme] .wc-w .wc-ic,html[data-theme] .wc-p .wc-ic,html[data-theme] .wc-ics{background:none!important;color:var(--muted)!important;width:16px!important}
.rh-heart.big{background:var(--card2,rgba(127,127,127,.12))!important}
.rh-bar span,.rh-bar span:first-child{background:var(--card2,rgba(127,127,127,.18))!important}
.rh-bl,html[data-theme="light"] .rh-bl{color:var(--muted)!important;font-weight:500!important}
.rh-best{stroke:var(--faint)!important;stroke-opacity:1!important}
.rh-scale{padding-bottom:0!important}.rh-bar{margin-bottom:26px!important}
.fdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
.fstate{background:none!important;padding:0!important}
.mnums span:not(.mk){color:var(--fg)}
.mnums span:not(.mk){color:var(--muted)!important}
/* Cómo llegas hoy: la tarjeta toma el color del veredicto */
.wcard.wc-color{--wc-tx:#fff;--wc-mu:rgba(255,255,255,.74);--wc-tile:rgba(255,255,255,.13);--wc-in:rgba(255,255,255,.16);background:var(--hc)!important;border-color:transparent!important;color:#fff}
.wc-color .wc-hero .wc-sc,html[data-theme="light"] .wc-color .wc-hero .wc-sc{color:#fff!important}
.wc-color .wc-dot{background:#fff!important}
html[data-theme] .wc-color .wc-ic,html[data-theme] .wc-color .wc-w .wc-ic,html[data-theme] .wc-color .wc-p .wc-ic,html[data-theme] .wc-color .wc-ics,.wc-color .wc-ic{color:rgba(255,255,255,.8)!important}
.wc-color .wc-hd .wc-edit,.wc-color .wc-skip{background:rgba(255,255,255,.16)!important;color:#fff!important}
.wc-color .wc-btn{background:#fff!important;color:var(--hc)!important}
.wc-color .wc-sl,.wc-color .wc-slrow .wc-sl{background:rgba(0,0,0,.16)!important}
.wc-color .wc-sl button{color:#fff!important}
.wc-color .wc-sl button[aria-checked="true"],.wc-color .wc-sl button[aria-pressed="true"]{background:#fff!important;color:var(--hc)!important}
.wc-color .wc-hvin input{background:rgba(255,255,255,.16);color:#fff}.wc-color .wc-hvin input::placeholder{color:rgba(255,255,255,.5)}
.wc-color .wc-meter{background:rgba(255,255,255,.2)!important}.wc-color .wc-hero .wc-meter i{background:#fff!important}
.wc-trend{margin-top:10px}.wc-trend svg{display:block;width:100%;height:40px;overflow:visible}
.wc-tl{stroke:rgba(255,255,255,.28);stroke-dasharray:2 4;vector-effect:non-scaling-stroke}
.wc-tp{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.wc-td{fill:#fff;stroke:var(--hc);stroke-width:2;vector-effect:non-scaling-stroke}
.wc-tx{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.66);margin-top:4px}
.wc-spk{display:block;width:100%;height:26px;margin:4px 0 2px;overflow:visible}
.wc-spk path{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.85}
.wc-spk circle{fill:currentColor}
.wc-color .wc-spk{color:#fff}
.wc-dt{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:1px;background:var(--faint)}
.wc-dt.ok{background:#30d158}.wc-dt.mid{background:#ffb340}.wc-dt.hi{background:#ff6961}
.wc-color .wc-dt{box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
/* Qué comer: línea de tiempo */
.qk{display:flex;align-items:baseline;gap:6px;margin:6px 0 4px}.qk b{font:700 44px/1 var(--round,var(--font));letter-spacing:-.03em;font-variant-numeric:tabular-nums}.qk span{color:var(--muted);font-size:14px}
.dtl{display:block;width:100%;height:auto;margin:8px 0 6px;overflow:visible}
.dt-base{stroke:var(--sep,rgba(127,127,127,.3));stroke-width:1}
.dt-band{fill:var(--fill)}
.dt-bl{font:600 11px var(--font);fill:var(--muted)}
.dt-kc{font:600 11px var(--font);fill:var(--fg);font-variant-numeric:tabular-nums}
.dt-t{font:600 11px var(--font);fill:var(--fg);font-variant-numeric:tabular-nums}
.dt-n{font:500 11px var(--font);fill:var(--muted)}
.dt-skip{opacity:.28}
.dt-ok{fill:var(--fg)}.dt-okc{fill:none;stroke:var(--bg,#fff);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dt-now{stroke:#ff453a;stroke-width:1.5;stroke-dasharray:3 3}.dt-nowd{fill:#ff453a}
@media (prefers-reduced-motion:no-preference){.dt-m>g{animation:dtIn .7s cubic-bezier(.2,.8,.3,1) both;transform-box:fill-box;transform-origin:bottom}.dt-m:nth-of-type(2)>g{animation-delay:.06s}.dt-m:nth-of-type(3)>g{animation-delay:.12s}.dt-m:nth-of-type(4)>g{animation-delay:.18s}}
@keyframes dtIn{from{transform:scaleY(.2);opacity:0}to{transform:none;opacity:1}}
.wc-done .wc-g{grid-template-rows:repeat(4,auto)}
@supports (grid-template-rows:subgrid){.wc-done .wc-f{grid-row:span 4}}
.wc-spk-e{height:26px}
.dt-band{fill:var(--fill);opacity:.55}.dt-bt{stroke:var(--fg);stroke-width:2.5;stroke-linecap:round}
/* gota */
.qd{display:flex;gap:14px;align-items:center;margin-top:6px}
.drop{flex:0 0 120px;width:120px;height:140px}
.dr-bg{fill:var(--fill);opacity:.45}.dr-f{opacity:.22}.dr-l{fill:none;stroke:var(--card);stroke-width:2.2}

.qd-s{flex:1;min-width:0}.qd .qk{margin:0 0 10px}.qd .qk b{font-size:34px}.qd .qk span{display:block;margin-top:2px;font-size:13px}
.qm-l{display:flex;flex-direction:column;gap:7px}
.qm{appearance:none;border:0;background:none;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer;display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:8px;align-items:center}
.qm i{width:9px;height:9px;border-radius:3px}.qm span{font-size:14px;line-height:1.15}.qm small{display:block;font-size:12px;color:var(--muted)}
.qv{font-variant-numeric:tabular-nums;white-space:nowrap}.qv b{font-weight:600}.qv small{display:inline!important;font-size:12px;color:var(--muted)}
.dstrip{display:block;width:100%;height:auto;margin:14px 0 4px;overflow:visible}
.ds-ax{stroke:var(--fill);stroke-width:2;stroke-linecap:round}
.ds-tr{stroke:var(--fg);stroke-width:5;stroke-linecap:round}.ds-tl{font:600 11px var(--font);fill:var(--muted)}
.ds-d{fill:var(--card);stroke:var(--fg);stroke-width:1.8}.ds-d.on{fill:var(--fg)}.ds-d.sk{opacity:.3}
.ds-t{font:600 11px var(--font);fill:var(--muted);font-variant-numeric:tabular-nums}
.ds-now{stroke:#ff453a;stroke-width:2;stroke-linecap:round}
.hcar-track{align-items:flex-start}
/* gota grande */
.qd2{display:flex;flex-direction:column;align-items:center;margin-top:4px}
.qd2 .drop{display:block;width:min(190px,54vw);height:auto;aspect-ratio:100/124;flex:none}
.dr-bg{fill:var(--fill);opacity:.7}.dr-f{opacity:.16}.dr-l{fill:none;stroke:var(--card);stroke-width:1.1;opacity:.9}
.dr-hl{pointer-events:none;opacity:.32;fill:#fff!important}
html[data-theme="dark"] .dr-f{opacity:.12}html[data-theme="dark"] .dr-hl{opacity:.18}
.qk2{text-align:center;margin-top:10px}.qk2 b{display:block;font:700 44px/1 var(--round,var(--font));letter-spacing:-.03em;font-variant-numeric:tabular-nums}.qk2 span{font-size:14px;color:var(--muted)}
.qc3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.qc{appearance:none;border:0;background:var(--card2);border-radius:14px;padding:10px 10px 9px;color:inherit;font:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.qc-n{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}.qc-n i{width:8px;height:8px;border-radius:2px;flex:none}
.qc b{font:650 20px var(--round,var(--font));font-variant-numeric:tabular-nums;white-space:nowrap}.qc b small{font-size:12px;font-weight:500;color:var(--muted)}
.qc-bar{display:block;height:4px;border-radius:2px;background:var(--fill);overflow:hidden;margin:3px 0 2px}.qc-bar i{display:block;height:100%;border-radius:2px}
.qc-k{font-size:11px;color:var(--muted)}
/* calidad de macros */
.qc-q{font-size:11px;color:var(--fg);opacity:.75;margin-top:1px}
.qs{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--card2)}
.qs span{font-size:12px;color:var(--muted);font-weight:600}.qs p{margin:3px 0 0;font-size:14px;line-height:1.4}

.ls-ms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}

.ls-c b small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.ls-b{display:block;height:4px;border-radius:3px;background:var(--fill2);margin-top:7px;overflow:hidden}
.ls-b i{display:block;height:100%;border-radius:3px}
.ls-cta{display:flex;align-items:center;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--edge-soft,rgba(127,127,127,.18))}

.ls-go{appearance:none;border:0;flex:none;background:var(--fg);color:var(--bg);font:600 15px var(--font);border-radius:999px;padding:11px 18px;cursor:pointer}

.mline .mcam2{background:var(--card2);width:36px;height:36px}
.mline .mb-go{appearance:none;border:0;background:none;padding:0 0 0 2px;cursor:pointer;line-height:1}

.xl-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.xs-one>section.glass{margin-top:6px}
.xs-one>section.glass>h2:first-child{display:none}
html.quiet *,html.quiet *::before,html.quiet *::after{animation:none!important;transition:none!important}
/* v179 · Rendimiento: carrera y bici diferenciadas; entrenos de bici por potencia */
.pf-h{margin:2px 0 6px}
.pf-sp{appearance:none;border:0;background:none;font:inherit;color:var(--fg);text-align:left;width:100%;display:flex;gap:12px;align-items:flex-start;padding:14px 0 12px;border-top:1px solid var(--edge-soft,rgba(127,127,127,.15));cursor:pointer}
.pf-h+.pf-sp{border-top:0}
.pf-sp:active{opacity:.7}
.pf-bd{flex:1;min-width:0;display:flex;flex-direction:column}
.pf-nm{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.pf-ms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pf-m span{display:block;font-size:12px;color:var(--muted)}
.pf-m b{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.pf-m b small{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.pf-m i{display:block;font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-sheet{display:flex;flex-direction:column;gap:10px}
.pf-sheet h3{margin:0}
.pf-sw{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.pf-sw button[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--fg)}
.pf-big{font-size:44px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:4px}
.pf-big small{font-size:17px;font-weight:500;color:var(--muted);letter-spacing:0}
.pf-conf{align-self:flex-start;font-size:13px;color:var(--muted);background:var(--card2);border-radius:999px;padding:5px 11px}
.pf-ch{margin:6px 0 0}
.pf-nm2{font-size:15px;font-weight:600;margin:4px 0 0}
.pf-zl{display:flex;flex-direction:column}
.pf-zr{display:flex;align-items:center;gap:10px;font-size:14px;padding:9px 0;border-top:1px solid var(--edge-soft,rgba(127,127,127,.15))}

.pf-news{appearance:none;border:0;font:inherit;color:var(--fg);text-align:left;width:100%;display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--card2);cursor:pointer}

.pf-nt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.pf-nt b{font-size:15px;font-weight:600}.pf-nt small{font-size:13px;color:var(--muted)}
.str-pwm{margin-bottom:4px}
.str-pw{display:flex;align-items:center;gap:8px;margin-top:8px}
.str-pw .str-step b{min-width:64px}
.str-pw small{color:var(--muted);font-size:13px}
/* v180 · Rendimiento: tarjetas que se deslizan, color con significado, deporte con relleno */
.pf-sw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sp-pick{appearance:none;border:0;font:500 15px var(--font);color:var(--fg);background:var(--card2);border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .18s}
.sp-pick svg{width:34px;height:34px;padding:6px;border-radius:10px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);box-sizing:border-box;flex:none}
.sp-pick[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 20%,var(--card2));font-weight:600}
.sp-pick[aria-pressed="true"] svg{background:var(--c);color:var(--on,#fff)}
.pf-sw button{box-shadow:none!important}
.pf-car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pf-car::-webkit-scrollbar{display:none}
.pf-cd{flex:0 0 calc(100% - 22px);scroll-snap-align:center;background:var(--card2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.pf-car>.pf-cd:only-child{flex-basis:100%}

.pf-cd .pf-big{margin-top:-4px}
.pf-chip{align-self:flex-start;font-size:13px;font-weight:600;color:var(--fg);background:color-mix(in srgb,var(--k) 22%,transparent);border-radius:999px;padding:5px 11px 5px 9px;display:inline-flex;align-items:center;gap:6px}
.pf-chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--k)}
.pf-g{position:relative;margin:8px 0 18px}
.pf-gb{position:relative;height:10px;border-radius:999px;overflow:hidden;background:var(--fill)}
.pf-gb i{position:absolute;top:0;bottom:0}
.pf-gm{position:absolute;top:-5px;width:4px;height:20px;margin-left:-2px;border-radius:3px;background:var(--fg);box-shadow:0 0 0 2px var(--card2)}
.pf-gl span{position:absolute;top:14px;transform:translateX(-50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.pf-zb{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;height:8px}.pf-zb i{border-radius:3px}
.pf-zr{padding:8px 0}
.pf-dots{display:flex;justify-content:center;gap:6px;margin-top:-2px}

/* v181 · En oscuro, el amarillo teñido queda pardo: fondo neutro elevado y el nombre del deporte en su color */
html:not([data-theme="light"]) .sp-pick[aria-pressed="true"],html:not([data-theme="light"]) .pa-sp[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 9%,#2c2c2e);color:var(--c)}
/* v183 · Duración con − / + y accesos directos */
.dp{display:flex;flex-direction:column;gap:10px}

.dp-v{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dp-ch{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.dp-c{appearance:none;border:0;min-height:36px;border-radius:10px;background:var(--fill2);color:var(--fg);font:500 14px var(--font);cursor:pointer;white-space:nowrap;padding:0 2px}

.pf-ct{display:flex;align-items:center;gap:8px}

.isl-v{color:var(--c);font-size:15px;font-weight:700;transition:color .2s}

.isl-d{display:flex;align-items:center;gap:8px;margin-top:8px;padding:10px 12px;border-radius:14px;background:var(--fill2);font-size:14px}

.qc3 .qc-n i{border-radius:50%!important}
.pmpick{appearance:none;border:0;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:0 12px 0 14px;border-radius:14px;background:var(--fill);color:var(--fg);font:600 15px var(--font);text-align:left;cursor:pointer}

button.dd{appearance:none;border:0;font:inherit;color:inherit;text-align:left;width:100%}

.opt-l{display:flex;flex-direction:column}
.opt-i{appearance:none;border:0;background:none;font:inherit;color:var(--fg);text-align:left;display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 2px;border-bottom:1px solid var(--edge-soft,rgba(127,127,127,.15));cursor:pointer}
.opt-i .tc-ic{width:34px;height:34px;border-radius:10px}

.opt-ck{color:var(--fg);flex:none}

html[data-theme] .badge{width:auto!important;min-width:0!important;flex:0 0 auto!important;box-sizing:border-box}

/* v188 · Sin bordes de color: cifras como en el resto de la app (punto de color + etiqueta, valor grande) */
.fu2-k div{border-top:0!important;padding:10px 10px 11px;gap:3px}
.fu2-k span{display:flex;align-items:center;gap:5px}
.fu2-k b small{font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:0}
.fu2-k em{font-style:normal;font-size:11.5px;color:var(--muted)}
.fu2-k span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.fu2-k b{font-size:20px;font-weight:700;letter-spacing:-.01em}
.frace-box{border-left:0!important;background:color-mix(in srgb,#ffd21e 12%,var(--card2))}
.ime{border-left:0!important;background:color-mix(in srgb,var(--c) 12%,var(--card2))}
/* v189 · La carita de «¿Cómo fue?» se queda en la actividad */
.tc-icw{position:relative;flex:0 0 auto;display:grid}
.rpe-badge{position:absolute;right:-6px;bottom:-6px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--rc);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.rpe-badge svg{width:22px;height:22px;stroke-width:1.9}
.rpe-badge.pre{opacity:0}
.rpe-badge.pop{animation:rpePop .42s cubic-bezier(.3,1.7,.5,1)}
@keyframes rpePop{0%{transform:scale(.6)}60%{transform:scale(1.22)}100%{transform:scale(1)}}
.rpe-t{color:var(--rc)!important;font-weight:600}
.rpe-fly{position:fixed;z-index:200;pointer-events:none;display:grid;place-items:center;transform-origin:center}
.rpe-fly svg{width:100%;height:100%}
.rpe-in{display:inline-grid;vertical-align:-3px;margin-left:6px;color:var(--rc)}
.rpe-in svg{width:17px;height:17px;stroke-width:2}
.rpe-dt{margin-top:12px}.rpe-dt .rpe{margin:0}
@media (prefers-reduced-motion:reduce){.rpe-badge.pop{animation:none}}
.tc-row.done .tc-tx small{white-space:normal;overflow:visible;text-overflow:clip}
/* v190 · Tercera tanda: explicaciones plegadas, cifras en recuadros, leyendas y etiquetas uniformes */
.inote{margin-top:10px}
.inote summary{list-style:none;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;padding:4px 0;-webkit-tap-highlight-color:transparent}
.inote summary::-webkit-details-marker{display:none}
.inote[open] summary{color:var(--fg)}
.inote>p{margin:6px 0 0!important}
.pst-row[data-paedit]{cursor:pointer}
.pst-row .mb-go{align-self:center;margin-left:auto}
.pa-ex{display:flex;justify-content:space-between;margin-top:2px}
/* cifras de resumen: siempre en recuadros (como Resumen semanal, Rendimiento o Avituallamiento) */
.kv{gap:8px!important;border-top:0!important;padding-top:0!important}
.kv div,.kv div+div{background:var(--fill2)!important;border:0!important;border-radius:14px!important;padding:10px 12px!important}
/* leyendas: punto redondo como en el resto */
.legend i{border-radius:50%!important;width:8px!important;height:8px!important}
/* deportes: todas las etiquetas del mismo ancho */
html[data-theme] .badge{width:104px!important;min-width:104px!important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
html[data-theme] .act .badge{min-width:104px!important}
.pst-row[data-paedit]{position:relative;padding-right:30px!important}
.pst-row .mb-go{position:absolute;right:12px;top:50%;transform:translateY(-50%);margin:0}
/* v190 · Calor en el avituallamiento */
.fu2-t{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 11px 5px 9px;border-radius:999px;background:var(--fill2);color:var(--fg)}
.fu2-t.hot{background:color-mix(in srgb,#ff9f0a 20%,transparent)}
/* v191 · Deriva cardiaca */
.dr-l{display:flex;flex-direction:column;margin-top:8px}
.dr-r{appearance:none;border:0;background:none;font:inherit;color:var(--fg);text-align:left;display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--edge-soft,rgba(127,127,127,.15));cursor:pointer}
.dr-r:first-child{border-top:0}
.dr-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.dr-t b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dr-t small{font-size:12.5px;color:var(--muted)}
.dr-v{display:flex;flex-direction:column;align-items:flex-end;gap:2px}.dr-v b{font-size:15px;font-variant-numeric:tabular-nums}.dr-v small{font-size:12px;font-weight:600;color:var(--k)}

/* Progreso por secciones (v193) */

.pwrap .legend{gap:4px 12px;flex-wrap:wrap}.pwrap .legend>*{white-space:nowrap}

.pg-p span{display:flex;flex-direction:column;gap:2px;min-width:0}.pg-p b{font-weight:600;font-size:15px}.pg-p small{font-size:13px;color:var(--muted)}
.pg-ch{color:var(--muted);flex:none;transition:transform .2s}.pg-p[open] .pg-ch{transform:rotate(180deg)}

/* Tarjetas internas (v197): una cifra principal por tarjeta a 28 px; variaciones sin caja; color solo en el punto */

.pwrap .ppill{color:var(--muted)!important;font-weight:500!important}
.vghost{fill:var(--fg);fill-opacity:.1}

.rh-bar span:nth-child(1){background:#ff375f!important}.rh-bar span:nth-child(2){background:color-mix(in srgb,#ff375f 65%,var(--card))!important}.rh-bar span:nth-child(3){background:color-mix(in srgb,#ff375f 40%,var(--card))!important}.rh-bar span:nth-child(4){background:color-mix(in srgb,#ff375f 20%,var(--card))!important}
.rh-bar span.on em{color:var(--fg)!important;font-weight:600!important}

.rh-bar{margin-bottom:44px!important}
.rh-bar span:nth-child(5){background:color-mix(in srgb,#ff375f 10%,var(--card))!important}

/* Gramática de gráficas */
.vz-g{stroke:var(--sep);stroke-width:1}
.vz-ref{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:3 4}

[data-vzread]{transition:opacity .12s}

.vz-go{appearance:none;border:0;background:var(--fill2);color:var(--fg);font:600 13px var(--font);padding:6px 10px;border-radius:999px;margin-left:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}

/* la lectura en vivo nunca cambia la altura de la tarjeta */

/* ---------- Cálculos ---------- */
function bodyFat(p){
  const h=num(p.height),w=num(p.waist),n=num(p.neck),hip=num(p.hip);
  if(!h||!w||!n)return null;
  let bf;
  if(p.sex==="f"){if(!hip||w+hip-n<=0)return null;bf=495/(1.29579-0.35004*Math.log10(w+hip-n)+0.221*Math.log10(h))-450}
  else{if(w-n<=0)return null;bf=495/(1.0324-0.19077*Math.log10(w-n)+0.15456*Math.log10(h))-450}
  return bf>3&&bf<60?bf:null;
}
/* Grasa corporal: media de Marina de EE. UU. y RFM (cintura/altura) con medidas; si no, IMC y edad (Deurenberg, poco fiable en deportistas). */
function bfEst(p){
  const h=num(p.height),w=num(p.waist),kg=num(p.weight),a=num(p.age),fem=p.sex==="f";const ok=v=>v!=null&&v>3&&v<60;
  const nv=bodyFat(p),rfm=h&&w?(fem?76:64)-20*h/w:null;
  if(ok(nv)&&ok(rfm))return{bf:(nv+rfm)/2,src:"med",how:"media de la fórmula de la Marina de EE. UU. y del RFM (cintura y altura)"};
  if(ok(nv))return{bf:nv,src:"med",how:"fórmula de la Marina de EE. UU."};
  if(ok(rfm))return{bf:rfm,src:"med",how:"RFM (cintura y altura)"};
  if(h&&kg&&a){const v=1.2*kg/(h/100)**2+.23*a-10.8*(fem?0:1)-5.4;if(ok(v))return{bf:v,src:"imc",how:"IMC y edad (orientativo: en deportistas con mucho músculo sobrestima la grasa)"}}
  return null;
}
function basal(p){
  const w=num(p.weight),h=num(p.height),a=num(p.age);
  const e=bfEst(p),bf=e?e.bf:null;
  const mif=(w&&h&&a)?(10*w+6.25*h-5*a+(p.sex==="f"?-161:5)):null;
  const cun=(w&&bf!=null)?500+22*w*(1-bf/100):null;
  if(cun&&mif){const wc=e.src==="med"?.7:.15;return{bmr:wc*cun+(1-wc)*mif,method:e.src==="med"?"70 % Cunningham (masa magra, la que mejor acierta en deportistas) y 30 % Mifflin-St Jeor":"Mifflin-St Jeor, con un 15 % de Cunningham (masa magra estimada por IMC)",bf,bfSrc:e.src,bfHow:e.how,mif,cun}}
  if(mif)return{bmr:mif,method:"Mifflin-St Jeor",bf,mif,cun};
  if(cun)return{bmr:cun,method:"Cunningham (masa magra)",bf,bfSrc:e.src,bfHow:e.how,mif,cun};
  return null;
}
const LEVELS={beg:{l:"Principiante",s:-0.05},mid:{l:"Intermedio",s:0},trained:{l:"Entrenado",s:0.04},elite:{l:"Muy entrenado",s:0.07}};
function hrParams(p){
  const a=num(p.age);let max=num(p.hrmax);if(!max&&a)max=208-0.7*a;const rest=num(p.hrrest)||60;
  const lthr=num(p.lthr);
  const fem=p.sex==="f",vl=vo2Level();let lv=vl!=null?vl:(LEVELS[p.level]||LEVELS.mid).s;
  const wh=num(p.waist)&&num(p.height)?num(p.waist)/num(p.height):0;const whs=wh>.5?Math.min(.03,(wh-.5)*.3):0;
  if(lthr){ /* x = FC / umbral de lactato; cruce al ~86 % del umbral, 90 % hidratos en el umbral */
    const sc=0.4;return{mode:"lt",max:max||lthr/0.9,rest,lthr,mid:0.86+lv*sc+(fem?0.015:0)-whs*sc,k:0.0637,sc,lvSrc:vl!=null?"vo2":"perfil",whs};
  }

/* Nivel aeróbico desde el VO2max estimado de tus actividades (por categorías, para que no cambie con cada sesión) */
const VO2_LV=[-0.05,-0.03,0,0.03,0.05,0.07];
function vo2Level(){try{if(!S.pmx||!S.acts||!S.acts.length)return null;const g=perfAgg();if(!g||!g.vo2||(g.nr||0)+(g.nb||0)<2)return null;const n=vo2Norm(g.vo2);const i=VO2L.indexOf(n);return i<0?null:VO2_LV[i]}catch(e){return null}}
function xOf(hr,hp){return hp.mode==="lt"?hr/hp.lthr:Math.max(0,(hr-hp.rest)/(hp.max-hp.rest))}
function ctxShift(hp,ctx){
  let s=0;if(!ctx)return 0;
  if(ctx.fasted)s+=0.04*hp.sc;
  const h=(ctx.t||0)/3600;if(h>1)s+=Math.min(0.06,(h-1)*0.025)*(hp.mode==="lt"?0.6:1);
  return s;

function choFrac(hr,hp,ctx){
  const x=xOf(hr,hp),mid=hp.mid+ctxShift(hp,ctx);

  return Math.min(1,Math.max(0.08,f));
}
function hrForFrac(p,hp){const x=hp.mid+hp.k*Math.log(p/(1-p));return hp.mode==="lt"?x*hp.lthr:hp.rest+x*(hp.max-hp.rest)}
function bandOf(f){for(const b of BANDS)if(f>=b.lo&&f<b.hi)return b;return BANDS[4]}
function computeSub(hr,time,kcal,hp,fasted){
  const n=Math.min(hr.length,time.length);

  let wsum=0;const w=new Array(n),dt=new Array(n);
  for(let i=0;i<n;i++){dt[i]=i?Math.max(0,time[i]-time[i-1]):0;w[i]=Math.max(hr[i]-hp.rest,5)*dt[i];wsum+=w[i]}
  if(!wsum)return null;
  let cho=0,fat=0;const bands={};BANDS.forEach(b=>bands[b.id]=0);
  const total=time[n-1]-time[0]||1,NB=120,bins=Array.from({length:NB},()=>({c:0,f:0,s:0,h:0}));
  for(let i=1;i<n;i++){
    const f=choFrac(hr[i],hp,{t:time[i]-time[0],fasted}),k=kcal*w[i]/wsum;cho+=k*f;fat+=k*(1-f);

    bins[bi].c+=k*f;bins[bi].f+=k*(1-f);bins[bi].s+=dt[i];bins[bi].h+=hr[i]*dt[i];
  }
  const series=bins.map(b=>{const m=Math.max(b.s,1)/60;return{c:+(b.c/m).toFixed(2),f:+(b.f/m).toFixed(2),h:b.s?+(b.h/b.s).toFixed(1):null}});
  return{cho:+cho.toFixed(1),fat:+fat.toFixed(1),bands,series,dur:total,hasHr:true};

function flatSub(kcal,frac){return{cho:+(kcal*frac).toFixed(1),fat:+(kcal*(1-frac)).toFixed(1),bands:null,series:null,hasHr:false}}

/* ---------- Calibración personal ----------
   Con tus actividades de los últimos 4 meses: gasto real por minuto y reparto hidratos/grasas por deporte e intensidad.
   Se mezcla con las tablas generales según cuántas sesiones haya (con pocas, pesa lo general; con muchas, lo tuyo). */
const med=a=>{if(!a.length)return null;const b=a.slice().sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
let CAL=null,CAL_K="";
function calib(kg){const k=S.acts.length+"|"+Object.keys(S.subs||{}).length+"|"+kg+"|"+(S.acts[0]&&S.acts[0].id);if(CAL&&CAL_K===k)return CAL;
  const from=shiftKey(today(),-120),out={};
  ["run","trail","mtb","walk","hike","str"].forEach(sp=>{const L=S.acts.filter(a=>a.sport===sp&&a.day>=from&&a.mov>=600&&a.kcal>0);if(!L.length)return;
    /* intensidad de cada sesión: por el pulso (reparto calculado) o, si no, por su velocidad frente a tus otras sesiones */
    const sp3=L.map(a=>a.speed||0).filter(Boolean).sort((x,y)=>x-y),t1=sp3[Math.floor(sp3.length/3)],t2=sp3[Math.floor(sp3.length*2/3)];
    const intOf=a=>{const u=S.subs[a.id];if(u&&u.cho+u.fat>0){const f=u.cho/(u.cho+u.fat);return f<.62?"s":f<.8?"m":"i"}if(sp==="str"||sp3.length<6||!a.speed)return"m";return a.speed<=t1?"s":a.speed>=t2?"i":"m"};
    const B={s:[],m:[],i:[]},R=[];
    L.forEach(a=>{const it=intOf(a),kpm=a.kcal/(a.mov/60),gen=(MET[sp][it]||8)*kg/60,u=S.subs[a.id];R.push(kpm/gen);B[it].push({kpm,chof:u&&u.cho+u.fat>0?u.cho/(u.cho+u.fat):null})});
    out[sp]={n:L.length,f:med(R),b:{}};
    Object.entries(B).forEach(([it,xs])=>{if(xs.length)out[sp].b[it]={n:xs.length,kpm:med(xs.map(x=>x.kpm)),chof:med(xs.map(x=>x.chof).filter(v=>v!=null)),nc:xs.filter(x=>x.chof!=null).length}})});

function calibFor(sport,int,kg){const c=calib(kg)[sport];if(!c)return null;const gen=(MET[sport]||MET.run)[int]*kg/60,ws=c.n/(c.n+4),fs=1+ws*((c.f||1)-1),b=c.b[int];
  let kpm=gen*fs,n=c.n,chof=null;
  if(b){const wb=b.n/(b.n+3);kpm=wb*b.kpm+(1-wb)*gen*fs;if(b.chof!=null){const wc=b.nc/(b.nc+3);chof=wc*b.chof+(1-wc)*(sport==="str"?.7:CHOF[int]||.6)}n=b.n}

const sameKind=(a,b)=>a===b||(a==="run"&&b==="trail")||(a==="trail"&&b==="run");
function plannedFor(k){return(S.plan&&S.plan[k])||[]}
function planMatch(k){

  const pl=plannedFor(k).map((s,i)=>{const j=real.findIndex((a,jj)=>!used.has(jj)&&sameKind(a.sport,s.sport));if(j>=0){used.add(j);return{s,i,st:"done",a:real[j]}}return{s,i,st:null}});

function pendingPlanned(k){if(k<today())return[];return planMatch(k).pl.filter(x=>x.st==="pend").map(x=>x.s)}
function sessName(s){if(s.steps&&s.steps.length&&s.sport!=="str")return SPORT_L[s.sport]+" · "+stShort(s.steps);if(s.sport==="str"&&s.routine){const r=allRoutines().find(x=>x.id===s.routine);if(r)return r.base?"Fuerza "+r.id:r.name}return SPORT_L[s.sport]}

const PST={done:["ok","Hecho"],chg:["chg","Cambiado"],skip:["skip","Saltado"],miss:["miss","No hecho"],pend:["pend","Previsto"]};
function pst(st){const v=PST[st];return`<span class="pst ${v[0]}">${v[1]}</span>`}
function nextKey(k){const d=new Date(k+"T12:00:00");d.setDate(d.getDate()+1);return keyOf(d)}
function dayTargets(k,raw){
  const p=S.profile||{};const b=basal(p);const w=num(p.weight);
  if(!b||!w)return null;
  const acts=S.acts.filter(a=>a.day===k);
  const plan=pendingPlanned(k).map(s=>Object.assign({},s,estSession(s,w)));
  const ex=acts.reduce((s,a)=>s+(a.kcal||0),0)+plan.reduce((s,x)=>s+x.kcal,0);
  const neatF=num(p.neat)||1.3,stp=S.steps&&S.steps[k];

  if(stp!=null){const extra=Math.max(0,stp-actSteps(k));neat=b.bmr*0.12+extra*0.0005*w;bySteps=true}
  if(!raw&&p.adaptOn&&S.adaptF&&S.adaptF!==1){adapt=(b.bmr+neat)*(S.adaptF-1);neat+=adapt}
  const tdee=b.bmr+neat+ex;
  const g=GOALS[p.goal]||GOALS.recomp;
  let kcal=tdee*(1+g.adj);if(kcal<b.bmr)kcal=b.bmr;
  let choBurn=0,fatBurn=0,pending=0;
  acts.forEach(a=>{const s=S.subs[a.id];if(s){choBurn+=s.cho/4;fatBurn+=s.fat/9}else if(a.kcal)pending++});
  plan.forEach(x=>{choBurn+=x.cho/4;fatBurn+=x.fat/9});

  if(C<floor){C=floor;F=Math.max(0.6*w,(kcal-4*P-4*C)/9);kcal=4*P+4*C+9*F;adjusted=true}
  /* Carga para mañana: si lo previsto mañana gasta mucho glucógeno, la cena de hoy sube hidratos */
  let bonus=0,tomorrow=null;const tk=nextKey(k);
  if(tk>=today()){const tp=plannedFor(tk);const tc=tp.reduce((s,x)=>s+estSession(x,w).cho/4,0);
    if(tc>120){bonus=Math.min(1.5*w,0.3*tc);tomorrow={cho:tc,sessions:tp};C+=bonus;kcal+=4*bonus}}
  return{b,neat,ex,tdee,kcal,P,F,C,g,choBurn,fatBurn,pending,adjusted,acts,plan,bonus,tomorrow,adapt,bySteps};
}

/* ---------- Reparto por comidas ---------- */
const MEALS=[["breakfast","Desayuno","08:00"],["lunch","Comida","14:00"],["snack","Merienda","17:30"],["dinner","Cena","21:30"]];
const toMin=s=>{const m=/^(\d{1,2}):(\d{2})/.exec(s||"");return m?(+m[1])*60+(+m[2]):null};

function mealPlan(t,k){

  const meals=MEALS.map(([id,n,def])=>({id,n,min:toMin(p["meal_"+id])??toMin(def),pre:false,post:false}));
  const sess=[];
  t.acts.forEach(a=>{const st=toMin((a.start||"").slice(11,16));if(st!=null)sess.push({st,en:st+Math.round((a.mov||0)/60),label:SPORT_L[a.sport]})});
  t.plan.forEach(s=>{const st=toMin(s.time);if(st!=null)sess.push({st,en:st+(s.dur||0),label:sessName(s)})});
  /* une sesiones seguidas (bici + fuerza) */
  sess.sort((a,b)=>a.st-b.st);const blocks=[];sess.forEach(s=>{const l=blocks[blocks.length-1];if(l&&s.st-l.en<=30){l.en=Math.max(l.en,s.en);l.label+=" + "+s.label}else blocks.push(Object.assign({},s))});
  blocks.forEach(bk=>{
    let pre=null,post=null;
    meals.forEach(m=>{if(m.min<=bk.st&&bk.st-m.min<=240)pre=m;if(post==null&&m.min>=bk.en&&m.min-bk.en<=240)post=m});
    if(pre)pre.pre=bk.label;if(post)post.post=bk.label;
  });
  const wc=meals.map(m=>m.post?1.8:m.pre?1.4:1),wf=meals.map(m=>m.post?.7:m.pre?.5:1.15),wp=meals.map(m=>m.post?1.2:1);
  const sum=a=>a.reduce((s,v)=>s+v,0),sc=sum(wc),sf=sum(wf),sp=sum(wp),baseC=t.C-t.bonus;
  meals.forEach((m,i)=>{m.P=t.P*wp[i]/sp;m.C=baseC*wc[i]/sc+(m.id==="dinner"?t.bonus:0);m.F=t.F*wf[i]/sf;m.kcal=4*m.P+4*m.C+9*m.F});
  return{meals,blocks};
}

/* ---------- Periodos ---------- */
function shiftKey(k,n){const d=new Date(k+"T12:00:00");d.setDate(d.getDate()+n);return keyOf(d)}
function mondayOf(k){const d=new Date(k+"T12:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return keyOf(d)}
function periodRange(p,a){
  if(p==="week"){const s=mondayOf(a);return[s,shiftKey(s,6)]}
  const y=+a.slice(0,4),m=+a.slice(5,7);
  if(p==="month"){const last=new Date(y,m,0).getDate();return[a.slice(0,7)+"-01",a.slice(0,7)+"-"+pad(last)]}
  return[y+"-01-01",y+"-12-31"];
}
function shiftAnchor(p,a,dir){
  if(p==="week")return shiftKey(a,7*dir);
  const d=new Date(a+"T12:00:00");d.setDate(1);
  if(p==="month")d.setMonth(d.getMonth()+dir);else d.setFullYear(d.getFullYear()+dir);
  return keyOf(d);
}
function periodLabel(p,a){
  const[s,e]=periodRange(p,a);
  if(p==="week"){const ds=new Date(s+"T12:00:00"),de=new Date(e+"T12:00:00");return ds.getDate()+" "+MON[ds.getMonth()].slice(0,3)+" – "+de.getDate()+" "+MON[de.getMonth()].slice(0,3)}
  if(p==="month"){const d=new Date(s+"T12:00:00");return MON[d.getMonth()][0].toUpperCase()+MON[d.getMonth()].slice(1)+" "+d.getFullYear()}
  return s.slice(0,4);
}
function fmtH(h){const t=Math.round(h*60),H=Math.floor(t/60),M=t%60;return H?H+" h "+pad(M):M+" min"}
function subOf(a){return S.subs[a.id]||flatSub(a.kcal||0,a.sport==="str"?.7:.6)}

  try{await c.doc("plan").set({kind:"plan",days:S.plan})}catch(e){toast(e&&e.code==="quota_exceeded"?"No queda espacio para guardar":"No se ha podido guardar el entreno previsto")}
}
function planAction(act,idx,k){
  S.plan=S.plan||{};if(k)readPlanInputs(k);
  if(act==="add"){(S.plan[k]=S.plan[k]||[]).push({sport:"run",dur:45,int:"s",time:"18:00"});(S.openDays=S.openDays||{})[k]=true}
  else if(act==="skip"){const x=(S.plan[k]||[])[idx];if(x){x.skip=!x.skip;if(!x.skip)delete x.skip;toast(x.skip?"Entreno marcado como saltado · calorías ajustadas":"Entreno recuperado")}}

function serAt(p){const r=FULL.ser,n=r.length,x=p*(n-1),i=Math.min(n-2,Math.floor(x)),t=x-i,a=r[Math.max(0,i)],b=r[Math.min(n-1,i+1)]||a;

(function(){let drag=false;

/* ---------- Copia en la nube, cifrada en el móvil ----------
   Un código de 24 caracteres genera dos cosas: el identificador de la copia en el servidor y la clave de cifrado.
   El servidor solo recibe datos ya cifrados: sin el código nadie (tampoco nosotros) puede leerlos. */
const CLOUD_CFG="https://javierfp1993-design.github.io/sustrato-web/config.json",B32="0123456789ABCDEFGHJKMNPQRSTVWXYZ";
const CLOUD_SKIP=id=>id==="cloud"||id==="eff"||id==="weather"||id.startsWith("sub_");
function cloudNewCode(){const b=crypto.getRandomValues(new Uint8Array(15));let bits="";b.forEach(x=>bits+=x.toString(2).padStart(8,"0"));let s="";for(let i=0;i<120;i+=5)s+=B32[parseInt(bits.slice(i,i+5),2)];return s.match(/.{4}/g).join("-")}
function cloudNorm(c){const s=String(c||"").toUpperCase().replace(/[^0-9A-Z]/g,"").replace(/O/g,"0").replace(/[IL]/g,"1");return s.length===24&&[...s].every(ch=>B32.includes(ch))?s.match(/.{4}/g).join("-"):null}
const b64=u=>{let s="";const a=new Uint8Array(u);for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode.apply(null,a.subarray(i,i+32768));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function sha(s){return new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))}
async function cloudKeys(code){const id=[...await sha("sustrato-id:"+code)].map(x=>x.toString(16).padStart(2,"0")).join(""),key=await crypto.subtle.importKey("raw",await sha("sustrato-key:"+code),"AES-GCM",false,["encrypt","decrypt"]);return{id,key}}
async function gz(u8,mode){const cs=mode==="c"?new CompressionStream("gzip"):new DecompressionStream("gzip");return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(cs)).arrayBuffer())}
let CLOUD_C=null;async function cloudCfg(){if(CLOUD_C)return CLOUD_C;const r=await fetch(CLOUD_CFG+"?t="+Date.now(),{cache:"no-store"});const j=await r.json();if(!j||!j.api)throw{code:"no_server"};CLOUD_C=j;return j}
async function cloudReq(id,method,body,prev){const c=await cloudCfg();const r=await fetch(c.api.replace(/\/$/,"")+"/backup/"+id+(prev?"?v=prev":""),{method,headers:{"Content-Type":"application/json","X-Sustrato-Key":c.key||""},body});
  if(r.status===404)return null;const j=await r.json().catch(()=>null);if(!r.ok)throw{code:(j&&j.code)||"server"};return j}
async function cloudSnapshot(){const c=userCol();if(!c)return null;const snap=await c.get(),docs={};snap.docs.forEach(d=>{if(!CLOUD_SKIP(d.id))docs[d.id]=d.data()});return docs}
async function cloudUpload(code){const docs=await cloudSnapshot();if(!docs)throw{code:"no_db"};const{id,key}=await cloudKeys(code),iv=crypto.getRandomValues(new Uint8Array(12));
  const plain=await gz(new TextEncoder().encode(JSON.stringify({app:"sustrato",v:1,at:new Date().toISOString(),docs})),"c");
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,plain);return cloudReq(id,"PUT",JSON.stringify({v:1,iv:b64(iv),data:b64(ct)}))}
async function cloudDownload(code,prev){const{id,key}=await cloudKeys(code),r=await cloudReq(id,"GET",undefined,prev);if(!r)return null;
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(r.iv)},key,unb64(r.data));const j=JSON.parse(new TextDecoder().decode(await gz(new Uint8Array(pt),"d")));if(j.app!=="sustrato"||!j.docs)throw{code:"bad"};return j}
async function cloudSaveCfg(){const c=userCol();if(c&&S.cloud)try{await c.doc("cloud").set(Object.assign({kind:"cloud"},S.cloud))}catch(e){}}
async function cloudBackup(manual){const cl=S.cloud;if(!cl||S.cloudBusy)return;S.cloudBusy=true;S.cloudTry=Date.now();if(manual)render();
  try{const r=await cloudUpload(cl.code);S.cloud=Object.assign({},cl,{last:(r&&r.at)||new Date().toISOString(),err:null});S.cloudDirty=false;await cloudSaveCfg();if(manual)toast("Copia guardada en la nube")}
  catch(e){S.cloud=Object.assign({},S.cloud,{err:e&&e.code||"net"});if(manual)toast("No se ha podido subir la copia. Revisa la conexión.")}
  S.cloudBusy=false;if(S.tab==="perfil")render()}
/* Copia automática: tras cambios (a los pocos minutos), al salir de la app y, como mínimo, una vez al día */

    <div class="bk-a" style="margin-top:10px"><button class="btn sm primary" data-act="clget" ${S.cloudBusy?"disabled":""}>${S.cloudBusy?"Buscando…":"Buscar mi copia"}</button><button class="chip sm" data-act="clrecno">Cancelar</button></div>`;
  else if(cl)body=`<p class="cl-t"><b>Copia en la nube activada</b><span class="cl-ok${cl.err?" err":""}">${cl.err?"No se pudo subir la última":"Al día"}</span></p><p class="note" style="margin:2px 0 10px">Se hace sola y va cifrada. Última copia: ${when(cl.last)}.</p>
    <div class="bk-a"><button class="btn sm" data-act="clnow" ${S.cloudBusy?"disabled":""}>${S.cloudBusy?"Subiendo…":"Hacer copia ahora"}</button><button class="btn sm" data-act="clshow">${S.cloudShow?"Ocultar código":"Ver código"}</button></div>
    ${S.cloudShow?`<div class="cl-code" style="margin-top:10px" aria-label="Código ${esc(cl.code)}">${codeHtml(cl.code)}</div>`:""}<button class="cl-l" data-act="cloff">Desactivar</button>`;
  else body=`<p class="cl-t"><b>Copia en la nube</b></p><p class="note" style="margin:2px 0 10px">Guarda tus datos cada día, cifrados con un código que solo tienes tú. Si cambias de móvil o algo falla, los recuperas.</p>
    <div class="bk-a"><button class="btn sm primary" data-act="clnew">Activar</button><button class="btn sm" data-act="clrec">Recuperar copia</button></div>`;
  return`<div class="cl-box">${body}</div>`}
async function cloudAction(a){
  if(a==="clnew"){S.cloudNew=cloudNewCode();render();return}

  if(a==="clcopy"){try{await navigator.clipboard.writeText(S.cloudNew||(S.cloud&&S.cloud.code)||"");toast("Código copiado")}catch(e){toast("No se ha podido copiar")}return}

function sparkPath(vals,W,H,pad,lo,hi){const pts=vals.map((v,i)=>v==null?null:[i/(vals.length-1)*W,H-pad-(v-lo)/((hi-lo)||1)*(H-2*pad)]);let d="",pen=false;pts.forEach(p=>{if(!p)return;d+=(pen?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)+" ";pen=true});const last=[...pts].reverse().find(Boolean);return{d,last}}
/* Peso frente al objetivo: se juzga la tendencia de 14 días (regresión), nunca el cambio de un día a otro,

function weightVerdict(){const W=(S.weights||[]).filter(x=>x.d>=shiftKey(today(),-13)&&x.kg).sort((a,b)=>a.d<b.d?-1:1);
  if(W.length<4||daysBetween(W[0].d,W[W.length-1].d)<7)return null;
  const xs=W.map(x=>daysBetween(W[0].d,x.d)),ys=W.map(x=>x.kg),n=xs.length,mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;
  let num=0,den=0;xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my);den+=(x-mx)*(x-mx)});const wk=den?num/den*7/my*100:0; /* % de peso por semana */
  const g=(S.profile||{}).goal||"maint",r=Math.round(wk*10)/10,t=(r>0?"+":r<0?"−":"±")+Math.abs(r).toFixed(1).replace(".",",")+" %/sem";
  if(g==="loss")return wk<=-1.2?["mid",t+" · rápido"]:wk<=-0.2?["ok",t+" · bien"]:wk<0.2?["mid",t+" · estable"]:["mid",t+" · sube"];
  if(g==="hyper")return wk>=0.6?["mid",t+" · rápido"]:wk>=0.1?["ok",t+" · bien"]:["mid",t+(wk>-0.1?" · estable":" · baja")];
  return Math.abs(wk)<=0.3?["ok",t+" · estable"]:["mid",t+(wk>0?" · sube":" · baja")]}

    <div class="sw-g">${f("sw_pre","Peso antes","kg",ex&&ex.pre,(num((S.profile||{}).weight)||"")+"")}${f("sw_post","Peso después","kg",ex&&ex.post,"")}${f("sw_drk","Bebido","ml",ex&&ex.drank,"0")}</div>
    <div class="sw-a"><button class="btn sm primary" data-sweat="${a.id}">${ex?"Recalcular":"Calcular y guardar"}</button>${ex?`<button class="chip sm danger" data-sweatdel="${a.id}">Borrar</button>`:""}</div></div>`}
function sweatCard(){const L=(S.sweat||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
  const how=`<ol class="sw-how"><li>Pésate justo antes de una sesión de al menos 45 minutos.</li><li>Apunta lo que bebas durante.</li><li>Sécate y vuelve a pesarte al terminar.</li><li>Abre la actividad en Sustrato y rellena "Tu tasa de sudor".</li></ol>`;
  if(!L.length)return`<section class="glass pad fade sw-card"><span class="pkk">Tasa de sudor</span><div class="sw-empty"><span class="sw-ic big" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M12 3.5s-6 6.6-6 11a6 6 0 0 0 12 0c0-4.4-6-11-6-11z"/></svg></span><div><b>Hidratación a tu medida</b><p>Cada persona suda distinto. Con una prueba sencilla, el avituallamiento y el agua del día usan tus litros por hora reales en lugar de una media.</p></div></div>${how}</section>`;
  const by={};L.forEach(x=>{(by[x.sport]=by[x.sport]||[]).push(x)});
  const wx=d=>{const w=(S.wx&&S.wx.days||[]).find(y=>y.date===d);return w?w.hi:null};
  const mx=Math.max(1.6,...L.map(x=>x.rate))*1.1,W=400,H=120;
  const pts=L.map((x,i)=>{const t=x.temp!=null?x.temp:wx(x.d);return{...x,t}});
  const hasT=pts.filter(p=>p.t!=null).length>=2;
  const tmin=hasT?Math.min(...pts.filter(p=>p.t!=null).map(p=>p.t))-2:0,tmax=hasT?Math.max(...pts.filter(p=>p.t!=null).map(p=>p.t))+2:1;
  const X=(p,i)=>hasT&&p.t!=null?16+(p.t-tmin)/(tmax-tmin)*(W-32):16+(L.length>1?i/(L.length-1):.5)*(W-32),Y=v=>H-14-v/mx*(H-28);
  const dots=pts.map((p,i)=>`<circle cx="${X(p,i).toFixed(1)}" cy="${Y(p.rate).toFixed(1)}" r="6" fill="${SPC[p.sport]||"#5ac8fa"}" data-tip="${esc(SPORT_L[p.sport])} · ${esc(dateLabel(p.d))}|${p.rate.toFixed(2).replace(".",",")} L/h${p.t!=null?" · "+r0(p.t)+" °C":""}"/>`).join("");
  return`<section class="glass pad fade sw-card"><span class="pkk">Tasa de sudor</span>
    ${Object.keys(by).length===1?(()=>{const sp=Object.keys(by)[0],r=sweatRate(sp),n=by[sp].length;return`<div class="vhead"><b>${r.toFixed(2).replace(".",",")}</b><span>L/h en ${esc(SPORT_L[sp])} · ${n} ${n===1?"prueba":"pruebas"}</span></div>`})():`<div class="sw-sp">${Object.entries(by).map(([sp,xs])=>{const r=sweatRate(sp);return`<div class="sw-t">${spIcon(sp)}<div><b>${r.toFixed(2).replace(".",",")} <small>L/h</small></b><span>${SPORT_L[sp]} · ${xs.length} ${xs.length===1?"prueba":"pruebas"}</span></div></div>`}).join("")}</div>`}
    <div class="sw-ch" style="${L.length<3?"display:none":""}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pruebas de sudor${hasT?" según temperatura":""}"><line x1="0" x2="${W}" y1="${H-14}" y2="${H-14}" stroke="var(--sep,rgba(127,127,127,.3))"/>${dots}</svg><div class="sw-ax"><span>${hasT?r0(tmin+2)+" °C":esc(dateLabel(L[0].d))}</span><span>${hasT?"temperatura":""}</span><span>${hasT?r0(tmax-2)+" °C":esc(dateLabel(L[L.length-1].d))}</span></div></div>
    <details class="inote"><summary>${IC_INFO}Cómo se calcula</summary><p class="note" style="margin:10px 0 0">Peso antes menos peso después, más lo bebido, entre las horas de la sesión. Ya se usa en tu avituallamiento y en el agua del día. Repite la prueba con calor y con frío: la tasa cambia mucho con la temperatura.</p></details></section>`}

function weekStats(wk){const end=shiftKey(wk,6),A=S.acts.filter(a=>a.sport!=="oth"&&a.day>=wk&&a.day<=end);
  const by={};A.forEach(a=>{by[a.sport]=(by[a.sport]||0)+a.mov});
  const avg=(arr)=>arr.length?arr.reduce((x,y)=>x+y,0)/arr.length:null;
  const wIn=(f,t)=>(S.weights||[]).filter(x=>x.d>=f&&x.d<=t).map(x=>x.kg),rIn=(f,t)=>Object.entries(S.rhr||{}).filter(([d])=>d>=f&&d<=t).map(([,v])=>v);
  let meals=0,ok=0,logged=0;for(let i=0;i<7;i++){const k=shiftKey(wk,i);if(k>today())break;meals+=4;const L=S.log[k]||{};["breakfast","lunch","snack","dinner"].forEach(m=>{const e=L[m];if(e){logged++;if(e.st==="done")ok++}})}
  const sl={good:0,ok:0,bad:0};for(let i=0;i<7;i++){const v=(S.sleep||{})[shiftKey(wk,i)];if(v)sl[v]++}
  const longest=A.slice().sort((a,b)=>b.mov-a.mov)[0];
  return{n:A.length,t:A.reduce((x,a)=>x+a.mov,0),km:A.filter(a=>a.sport!=="str").reduce((x,a)=>x+a.dist,0)/1000,by,cmp:weekCompliance(wk),
    w:avg(wIn(wk,end)),w0:avg(wIn(shiftKey(wk,-7),shiftKey(wk,-1))),r:avg(rIn(wk,end)),r0:avg(rIn(shiftKey(wk,-7),shiftKey(wk,-1))),meals,ok,logged,sl,longest}}
function weekCard(){const lw=shiftKey(mondayOf(today()),-7),wk=S.wkSum||lw,st=weekStats(wk),pv=weekStats(shiftKey(wk,-7));
  const f1=v=>v.toFixed(1).replace(".",","),dl=(a,b,u,dec,good)=>a!=null&&b!=null&&Math.abs(a-b)>=(dec?.05:.5)?`<em class="${good==null?"nt":(a<b)===good?"up":"dn"}">${a>b?"↑":"↓"} ${dec?f1(Math.abs(a-b)):Math.round(Math.abs(a-b))} ${u}</em>`:"";
  const tot=Object.values(st.by).reduce((x,y)=>x+y,0)||1,order=["run","trail","mtb","walk","hike","str"];
  const bar=order.filter(k=>st.by[k]).map(k=>`<i style="flex:${st.by[k]};background:${SPC[k]}" title="${SPORT_L[k]}: ${fmtDur(st.by[k])}"></i>`).join("");

  const tiles=[
    ["Entrenos",st.n,"sesiones",dl(st.n,pv.n,"",0,null)],

    ["Pulso medio",st.r!=null?Math.round(st.r):"—",st.r!=null?"ppm":"",dl(st.r,st.r0,"ppm",0,true)],
    ["Comidas",st.logged?st.ok+"/"+st.meals:"—",st.logged?"como previstas":"sin registrar",""],
    ["Sueño",st.sl.good+st.sl.ok+st.sl.bad?st.sl.good+"/"+(st.sl.good+st.sl.ok+st.sl.bad):"—",st.sl.good+st.sl.ok+st.sl.bad?"noches buenas":"sin registrar",""]];
  const txt=`Mi semana en Sustrato (${periodLabel("week",wk)}): ${st.n} entrenos · ${fmtDur(st.t)} · ${fmtInt(st.km)} km`+(st.cmp.n?` · plan ${st.cmp.ok}/${st.cmp.n}`:"")+(st.longest?` · más larga: ${SPORT_L[st.longest.sport]} ${fmtDur(st.longest.mov)}`:"");

    ${st.longest?`<p class="ws-hl"><span class="ws-star" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg></span>Sesión más larga: ${esc(SPORT_L[st.longest.sport])} · ${fmtDur(st.longest.mov)}${st.longest.dist?" · "+f1(st.longest.dist/1000)+" km":""} el ${esc(dateLabel(st.longest.day))}</p>`:""}

/* ---------- Avituallamiento real ---------- */
const PT_DEF=[{id:"g25",n:"Gel 25 g",t:"gel",c:25,caf:0,na:0},{id:"g45",n:"Gel 45 g",t:"gel",c:45,caf:0,na:0},{id:"g25c",n:"Gel 25 g con cafeína",t:"gel",c:25,caf:75,na:0},{id:"iso",n:"Isotónico 500 ml",t:"drink",c:30,caf:0,na:300},{id:"bar",n:"Barrita",t:"bar",c:25,caf:0,na:0},{id:"ban",n:"Plátano",t:"food",c:25,caf:0,na:0}];
const PT_T={gel:["Gel","#ffd21e"],drink:["Bebida","#5ac8fa"],bar:["Barrita","#ff9f0a"],food:["Comida","#30d158"]};
function pantry(){const own=S.pantry||[];return own.concat(PT_DEF.filter(d=>!own.some(o=>o.id===d.id)))}
function ptById(id){return pantry().find(p=>p.id===id)}
function ptSub(p){return[p.c+" g hidratos",p.caf?p.caf+" mg cafeína":null,p.na?p.na+" mg sodio":null].filter(Boolean).join(" · ")}
function fuelTarget(min){return min<75?0:min<120?40:min<180?60:75}
function fuelTol(){const L=(S.fuel||[]).filter(x=>x.gi==="good"&&x.cph>0);return L.length?Math.max(...L.map(x=>x.cph)):null}
function flTotals(items){let c=0,caf=0,na=0;(items||[]).forEach(it=>{const p=ptById(it.pid);if(!p)return;c+=p.c*it.q;caf+=(p.caf||0)*it.q;na+=(p.na||0)*it.q});return{c,caf,na}}

function riegel(t,d1,d2){return t*Math.pow(d2/d1,1.06)}
