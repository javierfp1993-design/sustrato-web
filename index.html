<style>
/* Layout: una columna de paneles de vidrio sobre negro, con navegación segmentada flotante; dos columnas en escritorio */
:root{
  color-scheme:dark;
  --bg:#000000;
  --fg:#f4f5f7;
  --muted:#9aa0aa;
  --faint:#6b717c;
  --glass:rgba(255,255,255,.055);
  --glass-hi:rgba(255,255,255,.11);
  --edge:rgba(255,255,255,.13);
  --edge-soft:rgba(255,255,255,.07);
  --prot:#ff5b2e;   /* proteína */
  --carb:#ffd21e;   /* hidratos / glucolítico */
  --fat:#3b82f6;    /* grasas / lipolítico */
  --hot:#ff5b2e;    /* glucolítico máximo */
  --ok:#7ee08a;
  --warn:#ffd21e;
  --err:#ff453a;
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:22px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:20px 120px;min-height:100vh}
.orbs{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(70px);opacity:.55;
  background:
   radial-gradient(38% 30% at 18% 22%,rgba(59,130,246,.30),transparent 70%),
   radial-gradient(34% 28% at 82% 30%,rgba(255,91,46,.28),transparent 70%),
   radial-gradient(40% 32% at 60% 88%,rgba(255,210,30,.22),transparent 70%)}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.glass{background:linear-gradient(180deg,var(--glass-hi),var(--glass));-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);
  border:1px solid var(--edge);border-radius:var(--r);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(255,255,255,.03),0 24px 50px rgba(0,0,0,.55);position:relative;overflow:hidden}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.10),transparent 38%)}
.pad{padding:20px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 10px 24px rgba(0,0,0,.5)}
.wordmark{display:flex;flex-direction:column;gap:2px}
.wordmark h1{margin:0;font-weight:600;font-size:24px;letter-spacing:-.035em;line-height:1.05;background:linear-gradient(180deg,#ffffff 30%,#b9bec7);-webkit-background-clip:text;background-clip:text;color:transparent}
.wordmark span{color:var(--muted);font-size:13px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:7px 12px;border-radius:999px}
.status::before{display:none}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
.sdot.ok{background:var(--ok);box-shadow:0 0 8px rgba(126,224,138,.7)}
.sdot.err{background:var(--err);box-shadow:0 0 8px rgba(247,116,106,.6)}
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:4px;padding:5px;border-radius:999px}
nav.tabs button{appearance:none;border:0;background:transparent;color:var(--muted);font:500 14px var(--font);padding:10px 16px;border-radius:999px;cursor:pointer;min-height:44px}
nav.tabs button[aria-selected="true"]{background:rgba(255,255,255,.14);color:var(--fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
nav.tabs button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--fat);outline-offset:2px}
h2{margin:0 0 4px;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
h3{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--edge-soft);background:rgba(255,255,255,.04);color:var(--muted);font:500 13px var(--font);padding:8px 13px;border-radius:999px;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{color:var(--fg);background:rgba(255,255,255,.14);border-color:var(--edge)}
.daystrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.day{flex:0 0 auto;min-width:52px;text-align:center;padding:8px 6px;border-radius:14px;border:1px solid var(--edge-soft);background:rgba(255,255,255,.03);color:var(--muted);cursor:pointer;font:inherit}
.day b{display:block;font-size:17px;color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.day small{font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.day[aria-pressed="true"]{background:rgba(255,255,255,.14);border-color:var(--edge)}
.day .dot{display:block;width:5px;height:5px;border-radius:50%;margin:4px auto 0;background:transparent}
.day .dot.on{background:var(--carb)}
.day .dot.pl{background:var(--prot)}
.day.fut b{color:var(--muted)}
.meals{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mt{color:var(--muted);font-family:var(--mono);font-size:12px;margin-left:4px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag-pre{background:rgba(255,210,30,.12);border-color:rgba(255,210,30,.3);color:var(--t-ffe270,#ffe270)}
.tag-post{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.3);color:var(--t-8ab4ff,#8ab4ff)}
.tag-load{background:rgba(255,91,46,.14);border-color:rgba(255,91,46,.35);color:var(--t-ffa184,#ffa184)}
.mbar{display:flex;gap:3px;height:8px;margin:8px 0 6px}
.mbar i{display:block;height:100%;border-radius:999px;min-width:2px}
.mnums{display:flex;gap:14px;font-size:13px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.mnums .mk{color:var(--muted);margin-left:auto}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;padding:22px}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr);gap:16px}}
.hero-r{display:flex;flex-direction:column;gap:14px;justify-content:center;min-width:0}
.hint{font-size:12px;color:var(--faint);margin:0}
.why{border:1px solid var(--edge-soft);border-radius:14px;background:rgba(255,255,255,.035);padding:0 14px}
.why summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:46px;font-size:14px;color:var(--muted)}
.why summary b{color:var(--fg);font-variant-numeric:tabular-nums}
.why summary::-webkit-details-marker{display:none}
.why .chev{transition:transform .2s;font-size:20px}
.why[open] .chev{transform:rotate(90deg)}
.why[open]{padding-bottom:12px}
.trainbar{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 18px;border-radius:20px;flex-wrap:wrap}
.trainbar .tl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tchips{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.tchip{appearance:none;border:1px solid var(--edge-soft);background:rgba(255,255,255,.04);color:var(--fg);font:500 13px var(--font);border-radius:14px;padding:5px 10px 5px 5px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-variant-numeric:tabular-nums;min-height:38px}
.tchip.plan{cursor:default;border-style:dashed;color:var(--muted)}
.tchip small{color:var(--faint)}
.tchip .badge{min-width:0;padding:4px 7px}
.subtabs{display:flex;gap:4px;padding:5px;border-radius:14px;overflow-x:auto}
.subtabs button{appearance:none;flex:1;border:0;background:transparent;color:var(--muted);font:500 14px var(--font);padding:10px 12px;border-radius:14px;cursor:pointer;min-height:44px;white-space:nowrap}
.subtabs button[aria-selected="true"]{background:rgba(255,255,255,.13);color:var(--fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.ico{flex:0 0 auto;width:38px;height:38px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--edge-soft);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.eltile{flex:0 0 auto;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;position:relative;font:600 15px var(--font);color:var(--c);background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.eltile small{position:absolute;top:3px;left:5px;font:500 8px var(--mono);color:var(--muted)}
.mi{display:flex;gap:12px;align-items:flex-start}
.mib{flex:1;min-width:0}
.supt{flex:1;min-width:0}
.seg{display:inline-flex;gap:3px;padding:4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--edge-soft)}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:500 13px var(--font);padding:8px 12px;border-radius:10px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:var(--fg)}
.pnav{display:flex;align-items:center;gap:10px}
.pnav h3{min-width:120px;text-align:center}
.mdish{font-size:13px;margin:-2px 0 6px;color:var(--fg)}
.mdish span{color:var(--muted);font-variant-numeric:tabular-nums}
.pweek{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:820px){.pweek{grid-template-columns:minmax(0,1fr)}}
.pday{border-radius:20px}

.rs{cursor:pointer;outline:none}

.rs:focus-visible .rs-p{stroke:rgba(255,255,255,.5);stroke-width:1}
.rs:active .rs-tile{transform:scale(1.01)}
.rad-x{cursor:pointer;outline:none}

.sets{display:flex;gap:6px;flex-wrap:wrap}

/* ===== Menú lateral ===== */

.drawer{position:fixed;top:0;bottom:0;left:0;z-index:61;width:min(300px,84vw);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px));
  background:rgba(22,22,24,.86);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border-right:.5px solid rgba(255,255,255,.1);transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.3,1)}

.dr-tx{display:flex;flex-direction:column;min-width:0}

.dr-tx small{font-size:12px;color:var(--muted)}
.dr-foot{margin-top:auto;padding:12px 10px 0;border-top:.5px solid var(--sep);display:flex;flex-direction:column;gap:4px}
.dr-user{font-weight:600}
.dr-st{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))!important}

/* ===== Estilo Apple sobrio ===== */
:root{
  --card:#141414;--card2:#232325;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.16);
  --sep:rgba(84,84,88,.55);--muted:#98989f;--faint:#636366;
  --font:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --round:var(--font);
  --mono:ui-monospace,"SF Mono","Geist Mono",Menlo,monospace;
  --r:16px;
}
body{background:#000;font-size:15px;letter-spacing:-.005em}
.orbs{display:none}
.wrap{gap:14px}
#view{gap:14px!important}
/* tarjetas sólidas */
.glass{background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none;border:0;box-shadow:none;border-radius:var(--r)}
.glass::before{display:none}
.pad{padding:18px}
/* cristal real solo en superficies flotantes */
nav.tabs,.sheet,.pop,.toast{background:rgba(30,30,32,.72)!important;-webkit-backdrop-filter:blur(30px) saturate(180%)!important;backdrop-filter:blur(30px) saturate(180%)!important;border:.5px solid rgba(255,255,255,.12)!important;box-shadow:0 20px 50px rgba(0,0,0,.6)!important}
.sheet{border-radius:20px}
.overlay{background:rgba(0,0,0,.6)}
/* cabecera y título grande */
header.top{padding-top:4px}
.logo{width:30px;height:30px;border-radius:10px;background:var(--card2);border:0;box-shadow:none}
.logo svg{width:20px;height:20px}
.wordmark h1{font-size:17px;font-weight:600;letter-spacing:-.01em;background:none;color:var(--fg);-webkit-background-clip:initial;background-clip:initial}
.wordmark span{display:none}
.status{background:transparent!important;border:0!important;box-shadow:none!important;padding:0;font-size:13px}
.ltitle{margin:6px 0 0;font:700 34px/1.1 var(--font);letter-spacing:-.025em}
.lsub{margin:2px 0 4px;color:var(--muted);font-size:15px}
/* tipografía de tarjetas */
h2{font-size:17px;font-weight:600;color:var(--fg);letter-spacing:-.01em;text-transform:none;margin:0 0 6px}
h3{font-size:20px;font-weight:600;letter-spacing:-.02em}
legend.lg,.month,.trainbar .tl{text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--muted)}
.big,.kv b,.stats b,.mrow .v,.pk,.miv,.wkc b,.donut text:first-of-type{font-family:var(--round)}
.big{font-weight:700}
/* menos cajas dentro de cajas */
.kv{gap:0;border-top:.5px solid var(--sep);padding-top:12px}
.kv div{background:none;border:0;border-radius:0;padding:0 12px 0 0}
.kv div+div{border-left:.5px solid var(--sep);padding-left:12px}
.stats div{background:var(--card2);border:0;border-radius:14px}
.why{background:var(--card2);border:0;border-radius:14px}
.lsum,.fuel,.wkc{background:var(--card2);border:0;border-radius:14px}
.sup{background:var(--card2);border:0;border-radius:14px}
.sup.warn{box-shadow:inset 0 0 0 1px rgba(255,69,58,.35)}
/* filas de lista */
.acts{gap:0}
.act{background:none;border:0;border-radius:0;border-bottom:.5px solid var(--sep);padding:12px 2px}
.act:last-child{border-bottom:0}
.act:hover{background:rgba(255,255,255,.03)}
.mi,.spark,.pm,.rstep,.shop,table.bands td,.strtab td{border-color:var(--sep)}
/* controles tipo iOS */
.chip{background:var(--fill);border:0;border-radius:10px;color:var(--fg);font-weight:500}
.chip[aria-pressed="true"]{background:#e5e5ea;color:#000}
.btn{background:var(--fill);border:0;border-radius:10px;font-weight:600}
.btn.primary{background:#fff;color:#000;border:0}
.btn.primary:hover{background:#ffffff}
input,select{background:var(--card2);border:0;border-radius:10px}
input.bad{box-shadow:inset 0 0 0 1px rgba(255,69,58,.7)}
.pill{background:var(--fill);border:0;border-radius:6px;font-weight:500}
.tag-pre{background:rgba(255,159,10,.18);color:var(--t-ffb340,#ffb340)}
.tag-post{background:rgba(59,130,246,.16);color:var(--t-8ab4ff,#8ab4ff)}
.tag-load{background:rgba(191,90,242,.18);color:var(--t-ffa184,#ffa184)}
.badge{border-radius:6px}
.seg,.subtabs{background:var(--fill2);border:0;border-radius:10px;padding:2px;gap:0}
.subtabs{box-shadow:none}
.seg button,.subtabs button{border-radius:6px;min-height:32px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--fg)}
.seg button[aria-pressed="true"],.subtabs button[aria-selected="true"]{background:#636366;box-shadow:0 1px 3px rgba(0,0,0,.4);color:#fff}
nav.tabs button{color:var(--muted);font-size:13px}
nav.tabs button[aria-selected="true"]{background:rgba(255,255,255,.14);color:var(--fg);box-shadow:none}
/* tira de días tipo calendario */
.day{background:none;border:0;padding:6px 2px;min-width:44px}
.day b{width:34px;height:34px;line-height:34px;margin:2px auto 0;border-radius:50%;font-size:17px;font-family:var(--round)}
.day[aria-pressed="true"]{background:none}
.day[aria-pressed="true"] b{background:#fff;color:#000}
.day small{font-size:11px;letter-spacing:0;text-transform:none}
.trainbar{border-radius:var(--r)}
.tchip{background:var(--card2);border:0;border-radius:10px}
.pday summary{padding:14px 16px}
.dnew{background:var(--card)}
.ico,.eltile{background:var(--card2);border:0;box-shadow:none;border-radius:10px}
.alert{background:rgba(255,69,58,.12);border:0;border-radius:14px}
.race{box-shadow:inset 0 0 0 1px rgba(255,159,10,.35)}
.note{color:var(--muted)}
.hero{padding:20px}
.toast{border-radius:14px}

/* ===== Cabecera ===== */
header.top{display:grid!important;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px;flex-wrap:nowrap;position:sticky;top:0;z-index:40;height:56px;padding:0!important;margin:-16px 0 -4px}
header.top::before{content:"";position:absolute;inset:0 -50vw;z-index:-1;background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-bottom:.5px solid rgba(255,255,255,0);transition:border-color .2s}
header.top.scrolled::before{border-bottom-color:rgba(255,255,255,.1)}
header.top .brand{justify-self:center;gap:8px}
header.top .logo{width:26px;height:26px;border-radius:6px}
header.top .logo svg{width:18px;height:18px}
header.top .wordmark h1{font-size:17px;line-height:1}
.hbtn{position:relative;margin:0 0 0 -11px!important;width:40px;height:40px}
header.top .hbtn svg{width:24px;height:24px}
.hbtn .sdot{position:absolute;top:8px;right:7px;width:7px;height:7px;display:none;box-shadow:0 0 0 2px #000!important}
.hbtn .sdot.err{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header .fab{width:36px;height:36px;justify-self:end;background:#fff;color:#000}

/* ===== Marca animada ===== */
header.top .wordmark h1{color:#f4f5f7;background:linear-gradient(100deg,#f4f5f7 0%,#f4f5f7 32%,#a9c7ff 43%,#ffffff 50%,#ffe7a0 57%,#f4f5f7 68%,#f4f5f7 100%) 100% 0/320% 100% no-repeat;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
@media (prefers-reduced-motion:no-preference){
  header.top .wordmark h1{animation:swIn 1.1s cubic-bezier(.2,.7,.2,1) .15s both,swWave 7s ease-in-out 1.6s infinite;-webkit-mask-image:linear-gradient(90deg,#000 45%,transparent 55%);mask-image:linear-gradient(90deg,#000 45%,transparent 55%);-webkit-mask-size:240% 100%;mask-size:240% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
  header.top .logo path{stroke-dasharray:34;stroke-dashoffset:34;animation:swDraw .9s cubic-bezier(.3,.7,.2,1) forwards}
  header.top .logo path+path{animation-delay:.12s}
  header.top .logo circle{transform-origin:16px 16px;transform:scale(0);animation:swDot .4s cubic-bezier(.3,1.6,.5,1) .75s forwards}
}
@keyframes swIn{0%{-webkit-mask-position:100% 0;mask-position:100% 0;filter:blur(5px);letter-spacing:.14em;opacity:0}60%{opacity:1}100%{-webkit-mask-position:0 0;mask-position:0 0;filter:blur(0);letter-spacing:-.01em;opacity:1}}
@keyframes swWave{0%{background-position:100% 0}45%,100%{background-position:0 0}}
@keyframes swDraw{to{stroke-dashoffset:0}}
@keyframes swDot{to{transform:scale(1)}}

/* ===== Registro rápido, plan vs hecho, deshacer ===== */
.qlog{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 12px}
.btn.sm{min-height:36px;padding:8px 14px;font-size:14px;border-radius:10px}
.rat{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.rat .chip.sm{min-width:40px;justify-content:center}
.pst{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.01em;padding:3px 8px;border-radius:999px;white-space:nowrap;flex:0 0 auto}
.pst::before{font-size:11px}
.pst.ok{color:var(--t-30d158,#30d158);background:rgba(48,209,88,.12)}.pst.ok::before{content:"✓"}
.pst.chg{color:var(--t-ffd21e,#ffd21e);background:rgba(255,210,30,.12)}.pst.chg::before{content:"↺"}
.pst.skip{color:#98989d;background:rgba(255,255,255,.07)}
.pst.miss{color:var(--t-ff6b5e,#ff6b5e);background:rgba(255,69,58,.12)}
.pst.pend{color:#98989d;background:rgba(255,255,255,.06)}
.prow.skipped>select,.prow.skipped>input,.prow.skipped>label{opacity:.4}
.pline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted);padding:2px 0}
.pline .chip{margin-left:auto}
.cmp{font-size:12px;font-weight:600;margin-left:4px}.cmp.hi{color:var(--t-30d158,#30d158)}.cmp.mid{color:var(--t-ffd21e,#ffd21e)}.cmp.lo{color:var(--t-ff6b5e,#ff6b5e)}
.tchip.plan{position:relative}
.trainbar .tchips{flex:1 1 200px}
.trainbar .tchip{max-width:100%;white-space:nowrap}
.tchip.off{opacity:.75}
.tskip{appearance:none;border:0;background:rgba(255,255,255,.08);color:var(--muted);width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;cursor:pointer;margin-left:2px;padding:0}
.tskip:hover{background:rgba(255,255,255,.16);color:var(--fg)}
.day .dot.miss{background:transparent;box-shadow:inset 0 0 0 1.5px #ff6b5e}
.toast.undo span{white-space:nowrap}
.toast.undo{display:flex;align-items:center;gap:14px;padding:8px 8px 8px 16px}
.toast.undo[hidden]{display:none}
.toast button{appearance:none;border:0;background:rgba(255,255,255,.12);color:var(--t-ffd21e,#ffd21e);font:600 14px var(--font);padding:7px 12px;border-radius:10px;cursor:pointer}
.toast button:hover{background:rgba(255,255,255,.2)}
#toast{pointer-events:auto}
@media (prefers-reduced-motion:no-preference){#view.sw-l{animation:swL .28s ease both}#view.sw-r{animation:swR .28s ease both}}
@keyframes swL{from{opacity:.3;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes swR{from{opacity:.3;transform:translateX(-24px)}to{opacity:1;transform:none}}

/* ===== Selector de apariencia ===== */
.dr-theme{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 8px}
.dr-theme>span{font-size:13px;color:var(--muted)}
.seg.sm button{padding:5px 10px;font-size:12px;min-height:0}


/* ===== Sustrato a pantalla completa ===== */
.chartbtn{appearance:none;border:0;background:none;padding:0;margin:0;width:100%;display:block;position:relative;cursor:zoom-in;color:inherit;border-radius:14px}
.chartbtn:focus-visible{outline:2px solid #ffd21e;outline-offset:4px}
.chartx{position:absolute;top:6px;right:6px;display:inline-flex;align-items:center;gap:5px;font:600 12px var(--font);color:var(--fg);background:var(--card2);padding:5px 9px;border-radius:999px;opacity:.85;transition:opacity .2s}
.chartbtn:hover .chartx{opacity:1}
body.noscroll{overflow:hidden}
.full{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex}
.full[hidden]{display:none}
.fu-in{flex:1;display:flex;flex-direction:column;max-width:1080px;margin:0 auto;width:100%;padding:calc(6px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px))}
.fu-top{display:flex;align-items:center;gap:8px;height:52px}
.fu-top .hbtn{margin:0 0 0 -10px!important}
.fu-tt{flex:1;text-align:center;display:flex;flex-direction:column;min-width:0}
.fu-tt b{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fu-tt small{font-size:12px;color:var(--muted)}
.fu-read{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:14px 0 6px;flex-wrap:wrap}
.fu-hr{display:flex;align-items:baseline;gap:6px}
.fu-hr .fu-k{font-size:13px;color:var(--muted);margin-right:4px;align-self:center}
.fu-hr b{font:700 56px/1 var(--round,var(--font));letter-spacing:-.03em;font-variant-numeric:tabular-nums;min-width:2.1ch}
.fu-hr .fu-u{font-size:15px;color:var(--muted);font-weight:600}
.fu-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.fu-band{--bc:#3b82f6;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:5px 11px 5px 9px;border-radius:999px;background:color-mix(in srgb,var(--bc) 18%,transparent);color:var(--fg)}
.fu-band::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bc)}
.fu-time{font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.fu-split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.fu-sp{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:8px;background:var(--card);border-radius:14px;padding:10px 12px}
.fu-sp .sw{width:10px;height:10px;border-radius:3px}
.fu-sp span:nth-child(2){font-size:13px;color:var(--muted)}
.fu-sp b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.fu-sp small{grid-column:2/4;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.fu-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:12px 0 4px;gap:2px}
.fu-bar i{display:block;border-radius:3px}
.fu-chart{flex:1 1 0;min-height:200px;margin-top:10px;touch-action:none;cursor:ew-resize;outline:none;border-radius:14px;user-select:none;-webkit-user-select:none}
.fu-chart:focus-visible{box-shadow:0 0 0 2px #ffd21e}
.fu-chart{position:relative;overflow:hidden}
.fu-chart svg{display:block;position:absolute;left:0;top:0}
.fu-in{height:100%;min-height:0;overflow:hidden}
.full{height:100vh;height:100dvh}
.fu-grid{stroke:var(--sep);stroke-dasharray:2 4}
.fu-base{stroke:var(--sep)}
.fu-line{stroke:var(--fg);stroke-width:1.5;stroke-opacity:.85}
.fu-dot{stroke:var(--bg);stroke-width:2.5}
.fu-hint{text-align:center;font-size:12px;color:var(--faint);margin:8px 0 0}
@media (prefers-reduced-motion:no-preference){.full:not([hidden]) .fu-in{animation:fuIn .28s cubic-bezier(.2,.8,.3,1) both}}
@keyframes fuIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.sheet{position:relative}
.sheet>.row:first-child{padding-right:44px}
.xclose{position:absolute!important;top:14px;right:14px;margin:0!important;z-index:2;flex:0 0 auto;background:var(--card2)!important;width:34px!important;height:34px!important;border-radius:50%!important;color:var(--muted)!important}
.xclose:hover{color:var(--fg)!important}
html,body{overflow-x:hidden;overflow-x:clip;max-width:100%}
html{overscroll-behavior-x:none}
header.top::before{inset:0 calc(50% - 50vw)!important}

/* ===== Progreso ===== */
.cbars{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;align-items:end;margin:16px 0 4px;height:150px}
.cbar{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.cbar .cv{font-size:11px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;min-height:14px}
.cbar .ct{flex:1;width:100%;max-width:34px;background:var(--card2);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.cbar .ct i{display:block;width:100%;border-radius:6px}
.cbar small{font-size:11px;color:var(--faint);white-space:nowrap}
.whl{display:flex;flex-direction:column;margin-top:6px}
.wh{display:grid;grid-template-columns:1fr auto 56px 26px;align-items:center;gap:10px;padding:10px 0;border-top:.5px solid var(--sep);font-variant-numeric:tabular-nums}
.wh:first-child{border-top:0}
.wh span:first-child{color:var(--muted);font-size:14px}
.whd{font-size:13px;text-align:right;color:var(--muted)}

.ptiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ptile{display:flex;flex-direction:column;align-items:stretch;gap:10px;min-width:0;text-align:left}
.pkk{display:block;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted);text-transform:uppercase}
[class*="card-"] .pkk{color:rgba(255,255,255,.78)}
.pbig{font:700 52px/1 var(--round,var(--font));letter-spacing:-.035em;font-variant-numeric:tabular-nums;margin-top:6px}
.pbig small{font-size:20px;font-weight:600;margin-left:4px;letter-spacing:0;opacity:.6}
.ptile .pbig{font-size:44px;color:#fff}
.pmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.ppill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(191,90,242,.16);color:var(--t-c77dff,#c77dff);font-variant-numeric:tabular-nums}
.ppill.good{background:rgba(48,209,88,.15);color:var(--t-30d158,#30d158)}.ppill.bad{background:rgba(255,159,10,.15);color:var(--t-ffb340,#ffb340)}
.phero .wbig{margin-top:14px}
.wg{stroke:var(--sep);stroke-dasharray:2 4}
.wdot{fill:var(--faint);fill-opacity:.7}
.wlast{stroke:var(--card);stroke-width:2.5}
.card-green{background:#1f9d48!important;color:#fff}
.card-green .chip,.card-violet .chip.sm{background:rgba(0,0,0,.22);color:#fff;border:0}
.card-violet .chip.sm[aria-pressed="true"]{background:#fff;color:#000}
.ptr{display:flex;justify-content:center;margin:6px 0 2px}
.ptr+.pt-s,.ptr~.pt-s{text-align:center}
.ptr+.mbars{margin:0 auto;width:100%;max-width:140px}
.ring-v{transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.3,1)}
.ring-t{fill:#fff;font:700 20px var(--round,var(--font));letter-spacing:-.02em}
.pt-s{margin:0;font-size:13px;line-height:1.35;color:rgba(255,255,255,.85)}
.mbars{display:flex;align-items:flex-end;gap:4px;height:34px}
.mbars i{flex:1;background:#fff;border-radius:3px;opacity:.95}
.mbars i.nil{background:rgba(255,255,255,.25)}
.cmpb{display:flex;flex-direction:column;gap:8px;margin:2px 0}
.cmpb div{display:grid;grid-template-columns:1fr auto;grid-template-areas:"l v" "b b";gap:3px 6px;align-items:center}
.cmpb span{grid-area:l;font-size:12px;color:rgba(255,255,255,.8)}
.cmpb b{grid-area:v;font-size:13px;color:#fff;font-variant-numeric:tabular-nums}
.cmpb i{grid-area:b;display:block;height:7px;border-radius:4px;background:#fff}
.cmpb i.ghost{background:rgba(255,255,255,.35)}
.ptile .chip.sm{align-self:flex-start;margin-top:auto}
@media (min-width:900px){.ptiles{grid-template-columns:1fr 1fr}}

/* ===== Gráficos de progreso ===== */
.pwrap{display:flex;flex-direction:column;gap:14px}
.ctip{position:fixed;z-index:90;pointer-events:none;display:flex;flex-direction:column;gap:2px;padding:8px 11px;border-radius:10px;background:rgba(40,40,44,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:260px}
.ctip b{font-size:12px;font-weight:600}.ctip span{color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums}
.ctip[hidden]{display:none}
html[data-theme="light"] .ctip{background:rgba(255,255,255,.95);color:#1c1c1e;box-shadow:0 10px 30px rgba(0,0,0,.15),0 0 0 .5px rgba(0,0,0,.06)}
html[data-theme="light"] .ctip span{color:#6c6c70}
.hmw{margin-top:12px}
.heat{display:block;width:100%}
.hm{fill:var(--card2);transition:transform .15s}
.hm.l1{fill:rgba(48,209,88,.3)}.hm.l2{fill:rgba(48,209,88,.52)}.hm.l3{fill:rgba(48,209,88,.76)}.hm.l4{fill:#30d158}
.hm.hm-t{stroke:var(--fg);stroke-width:1.2}
rect.hm[data-tip]{cursor:pointer}
rect.hm.tip-on{stroke:var(--fg);stroke-width:1.5}
.hml{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:8px;font-size:11px;color:var(--faint)}
.hml i{width:11px;height:11px;border-radius:3px;display:inline-block;background:var(--card2)}
.hml i.l1{background:rgba(48,209,88,.3)}.hml i.l2{background:rgba(48,209,88,.52)}.hml i.l3{background:rgba(48,209,88,.76)}.hml i.l4{background:#30d158}
.vhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.vhead b{font:700 28px/1.1 var(--round,var(--font));letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.vhead>span:not(.ppill){color:var(--muted);font-size:14px}
.vhead .ppill{margin-left:auto}
.vol{display:block;width:100%;margin-top:6px}
.vb{cursor:pointer}.vb>rect:not(:first-child){transition:opacity .2s}
.vol:has(.tip-on) .vb:not(.tip-on)>rect:not(:first-child){opacity:.4}
.vnil{fill:var(--sep)}
.vavg{stroke:var(--muted);stroke-dasharray:3 4;stroke-width:1.2}
.vband{fill:rgba(48,209,88,.10)}
.vavg-i{display:inline-block;width:14px;height:0!important;border-top:1.5px dashed var(--muted);background:none!important;border-radius:0!important}
.tipdot{cursor:pointer;transition:r .15s}
.tipdot.tip-on{r:7.5px;stroke:var(--card);stroke-width:2}
.card-blue .tipdot.tip-on{stroke:#fff}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.rec{appearance:none;border:0;text-align:left;cursor:pointer;font:inherit;color:var(--fg);background:var(--card2);border-radius:14px;padding:12px 12px 11px;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden;transition:transform .15s}
.rec::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.rec:hover{transform:translateY(-1px)}
.rec-l{font-size:12px;color:var(--muted)}
.rec b{font:700 24px/1.15 var(--round,var(--font));letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rec small{font-size:12px;color:var(--faint)}
.wbig .scr-hit{cursor:crosshair;touch-action:pan-y}
.scr-l{stroke:var(--fg);stroke-width:1;stroke-opacity:.6}
.scr-d{stroke:var(--card);stroke-width:2.5}
.scr-r{fill:var(--fg)}
.scr-t1{fill:var(--card);font:700 14px var(--font)}
.scr-t2{fill:var(--card);font:500 11px var(--font);opacity:.75}
@media (prefers-reduced-motion:no-preference){
  .pwrap.anim .vb,.pwrap.anim .ring-v{animation:grow .7s cubic-bezier(.2,.8,.3,1) both;animation-delay:var(--d,0ms);transform-box:fill-box;transform-origin:bottom}
  .pwrap.anim .hm{animation:pop .35s ease both;animation-delay:calc(var(--d,0ms) * .5)}
  .pwrap.anim .draw,.pwrap.anim .wbig path[stroke]{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.2s cubic-bezier(.3,.7,.2,1) .1s forwards}
  .pwrap.anim .ring-v{animation:ringIn 1s cubic-bezier(.2,.8,.3,1) both}
}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
@keyframes pop{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ringIn{from{stroke-dashoffset:300}}
.subtabs{overflow:hidden!important;display:flex!important;width:100%}
.subtabs button{flex:1 1 auto!important;min-width:0;padding:6px 6px!important;overflow:hidden;text-overflow:ellipsis}
@media (max-width:360px){.subtabs button{font-size:12px!important}}

.wrng{margin-top:16px;padding-top:14px;border-top:.5px solid var(--sep)}
.wrng-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.wtrack{position:relative;height:10px;border-radius:6px;background:var(--card2);margin:30px 6px 10px}
.wfill{position:absolute;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,rgba(191,90,242,.35),rgba(191,90,242,.75))}
.wtrack .wm{position:absolute;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;cursor:pointer}
.wtrack .wm em{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font:600 12px var(--font);font-style:normal;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.wtrack .wm.st{background:var(--card);box-shadow:inset 0 0 0 2.5px #bf5af2}
.wtrack .wm.nw{background:#bf5af2;box-shadow:0 0 0 3px var(--card)}
.wtrack .wm.nw em{color:var(--fg);font-weight:700}
.wtrack .wm.ref{width:3px;height:22px;border-radius:2px;background:var(--fg);opacity:.7}
.wtrack .wm.ref em{bottom:auto;top:25px}
.wtrack.has-ref{margin-bottom:30px}
.wlg{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:14px}
.wlg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.wlg i.st{box-shadow:inset 0 0 0 2px #bf5af2}.wlg i.nw{background:#bf5af2}.wlg i.ref{width:3px;height:11px;border-radius:2px;background:var(--fg);opacity:.7}
.wmm{margin-left:auto;color:var(--faint);font-variant-numeric:tabular-nums}
.wri{margin:10px 0 0;font-size:14px;color:var(--muted)}.wri b{color:var(--fg)}
.wref-ed{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wref-ed input{width:76px;min-height:32px;padding:4px 10px}

/* ===== Donut protagonista ===== */
.hero .macro{gap:22px}
.hero .donut{width:200px;height:200px}
@media (max-width:700px){
  .hero .macro{flex-direction:column;align-items:stretch}
  .hero .macro>svg.donut{align-self:center;width:min(270px,74vw);height:auto;margin:6px 0 4px}
  .hero .mlist{width:100%}
}
.hero .donut{filter:drop-shadow(0 8px 24px rgba(0,0,0,.25))}
html[data-theme="light"] .hero .donut{filter:drop-shadow(0 8px 20px rgba(0,0,0,.06))}
@media (prefers-reduced-motion:no-preference){.hero .donut circle[data-macro]{animation:dIn .9s cubic-bezier(.2,.8,.3,1) both}}
@keyframes dIn{from{stroke-dasharray:0 400}}

.aline{margin-top:14px;padding-top:12px;border-top:.5px solid var(--sep);display:flex;flex-direction:column;gap:8px}
.aline-t{font-size:13px;color:var(--muted)}.aline-t b{color:var(--fg);font-weight:600}
.aline-b{height:4px;border-radius:2px;background:var(--card2);overflow:hidden}.aline-b i{display:block;height:100%;background:#bf5af2;border-radius:2px}
.pwide .pbig{font-size:44px}
.pwide .cmpb{max-width:420px}
.vplan{stroke:var(--fg);stroke-width:3;stroke-linecap:round}
.vplan-d{fill:var(--fg)}
.vplan-i{display:inline-block;width:14px;height:0!important;border-top:3px solid var(--fg);background:none!important;border-radius:0!important}
.vplan-t{margin:2px 0 0;font-size:13px;color:var(--muted)}.vplan-t b{color:var(--fg)}

/* ===== Forma, marca, intensidad, composición ===== */
.pfit .fkpi{display:grid;grid-template-columns:repeat(3,auto) 1fr;gap:6px 22px;align-items:end;margin-top:10px}
.fkpi div{display:flex;flex-direction:column}
.fkpi span{font-size:12px;color:var(--muted)}
.fkpi b{font:700 32px/1.05 var(--round,var(--font));letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.fkpi .fst{align-items:flex-end;justify-content:flex-end}
.fstate{--sc:#30d158;display:inline-flex;align-items:center;gap:6px;font-size:13px!important;font-weight:600;color:var(--fg)!important;padding:5px 11px 5px 9px;border-radius:999px;background:color-mix(in srgb,var(--sc) 16%,transparent)}
.fstate::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sc)}
@media (max-width:420px){.pfit .fkpi{grid-template-columns:repeat(3,1fr)}.fkpi .fst{grid-column:1/-1;align-items:flex-start}}
.fdesc{margin:8px 0 0;font-size:14px;color:var(--muted)}
.fit{display:block;width:100%;margin-top:12px}
.ffut{fill:var(--fg);fill-opacity:.035}
.ftoday{stroke:var(--fg);stroke-opacity:.45;stroke-width:1}
.frace{stroke:#ffd21e;stroke-width:1.5;stroke-dasharray:3 3}
.frace-t{fill:var(--t-ffd21e,#ffd21e)!important;font-weight:600}
.fhit{fill:transparent;cursor:crosshair}
.fhit.tip-on{fill:var(--fg);fill-opacity:.08}
.frace-box{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--card2);display:flex;flex-direction:column;gap:3px;border-left:3px solid #ffd21e}
.frace-box b{font-size:14px}.frace-box span{font-size:13px;color:var(--muted)}
.preds{display:flex;gap:28px;margin-top:10px;flex-wrap:wrap}
.preds div{display:flex;flex-direction:column}
.preds span{font-size:12px;color:var(--muted)}
.preds b{font:700 36px/1.05 var(--round,var(--font));letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.preds small{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pgbar{margin-top:14px}
.pgbar-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.pgbar-h b{color:var(--fg);font-weight:600}
.pgtrack{height:8px;border-radius:4px;background:var(--card2);margin-top:8px;overflow:hidden}.pgtrack i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,rgba(255,210,30,.5),#ffd21e)}
.pgoal{stroke:var(--fg);stroke-opacity:.5;stroke-dasharray:4 4}
.bsum{display:flex;gap:26px;margin-top:10px}
.bsum div{display:flex;flex-direction:column}.bsum b{font:700 26px/1.1 var(--round,var(--font));font-variant-numeric:tabular-nums}.bsum span{font-size:12px;color:var(--muted)}
.brows{display:flex;flex-direction:column;gap:8px;margin:14px 0 10px}
.brow{display:grid;grid-template-columns:34px 1fr 56px;gap:10px;align-items:center}
.brow>span{font-size:12px;color:var(--muted);text-transform:capitalize}
.brow small{font-size:12px;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}
.bbar{display:flex;height:14px;border-radius:6px;overflow:hidden;background:var(--card2);gap:1px}
.bbar i{display:block;height:100%;cursor:pointer}.bbar i.nil{background:transparent}
.bbar i.tip-on{filter:brightness(1.2)}
.bcomp{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.bstack{display:flex;height:22px;border-radius:10px;overflow:hidden;gap:2px}
.bstack i{display:block;height:100%;cursor:pointer}.bstack .bl{background:#bf5af2}.bstack .bf{background:color-mix(in srgb,#bf5af2 30%,var(--card2))}
.bkv{display:flex;gap:28px}.bkv div{display:flex;flex-direction:column}.bkv b{font:700 24px/1.1 var(--round,var(--font));font-variant-numeric:tabular-nums}.bkv span{font-size:12px;color:var(--muted)}
.yhead,.yrow{display:grid;grid-template-columns:1fr 84px 84px 64px;gap:8px;align-items:baseline}
.yhead{margin-top:12px;font-size:12px;color:var(--faint);text-align:right}
.yrow{padding:9px 0;border-top:.5px solid var(--sep);font-variant-numeric:tabular-nums}
.yhead+.yrow{border-top:0}
.yrow span{font-size:14px;color:var(--muted)}.yrow b{text-align:right;font-size:15px}.yrow small{text-align:right;font-size:14px;color:var(--faint)}.yrow em{text-align:right;font-style:normal;font-size:12px;color:var(--muted)}
.strl{appearance:none;border:0;cursor:pointer;font:inherit;color:var(--fg);display:flex;align-items:center;gap:14px;padding:14px 16px 14px 18px;text-align:left;width:100%}

@media (min-width:900px){.tabbar{left:50%;right:auto;transform:translateX(-50%);bottom:16px;border-radius:20px;border:.5px solid rgba(255,255,255,.12);padding:6px 10px;gap:4px;box-shadow:0 20px 50px rgba(0,0,0,.4)}.tabbar button{width:96px;flex:0 0 auto}html[data-theme="light"] .tabbar{border-color:rgba(0,0,0,.08);box-shadow:0 20px 50px rgba(0,0,0,.12)}}

/* ===== Creador de rutinas ===== */

}

.tc-row:active{transform:scale(.99)}

.tc-ic{flex:0 0 auto;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
html[data-theme="light"] .tc-ic{color:color-mix(in srgb,var(--c) 80%,#000)}
.tc-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tc-tx b{font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-tx small{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tc-meta b{font-size:15px;font-weight:600}.tc-meta small{font-size:12px;color:var(--muted)}
.tc-x{appearance:none;border:0;flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--card);color:var(--muted);font-size:12px;cursor:pointer;display:grid;place-items:center}
.tc-x:hover{color:var(--fg)}
.tc-go{font-size:20px;color:var(--faint);margin-left:-2px}
.tc-meta small.ok{color:var(--t-30d158,#30d158);font-weight:600}
.tc-foot .chip{white-space:nowrap}
.tc-row .pst{flex:0 0 auto}
.tc-empty{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px;border-radius:14px;background:var(--card2)}
.tc-empty .tc-ic{--c:#98989d}
.tc-empty span{display:flex;flex-direction:column;gap:2px}.tc-empty b{font-size:17px}.tc-empty small{font-size:13px;color:var(--muted)}
.tc-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.tcard .wxa{margin-top:10px}
.tcard .row .wxp{font-size:13px;padding:4px 10px 4px 7px}
@media (max-width:420px){.tc-row .pst{display:none}}

/* ===== Tanda 1 ===== */
.lsub-t{margin-left:6px;color:var(--muted);font-size:.92em}
.strip-h{margin-bottom:12px;align-items:center;flex-wrap:nowrap!important;gap:8px}
.strip-m{font-size:15px;font-weight:600;text-transform:capitalize;letter-spacing:-.01em}
.hcar{margin:0 -16px;position:relative}
.hcar-track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-padding:0 16px}
.hcar-track::-webkit-scrollbar{display:none}
.hcar-track>section{flex:0 0 100%;scroll-snap-align:center;min-width:0}
.hcar-dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.hcar-dots i{width:6px;height:6px;border-radius:3px;background:var(--faint);opacity:.45;cursor:pointer;transition:width .25s,opacity .25s,background .25s}
.hcar-dots i.on{width:18px;opacity:1;background:var(--fg)}
@media (min-width:900px){.hcar{margin:0}.hcar-track{display:grid;grid-template-columns:1fr 1fr;overflow:visible;padding:0}.hcar-dots{display:none}}
.badge{width:76px!important;min-width:76px!important;padding-left:0!important;padding-right:0!important;text-align:center;box-sizing:border-box;display:inline-block;flex:0 0 76px}

/* ===== Tanda 2: sistema de botones y tipografía ===== */
:root{--fs-h2:17px;--fs-body:15px;--fs-note:13px}
h2{font-size:var(--fs-h2)!important;font-weight:600!important;letter-spacing:-.01em}
.note{font-size:var(--fs-note)}
.btn{min-height:42px!important;border-radius:14px!important;font:600 15px var(--font)!important;padding:9px 16px!important;border:0!important;background:var(--card2);color:var(--fg)}
.btn.sm{min-height:34px!important;border-radius:10px!important;font-size:14px!important;padding:6px 13px!important}
.btn:not(.primary):hover{background:color-mix(in srgb,var(--fg) 8%,var(--card2))}
.chip{min-height:34px;border-radius:10px!important;font-weight:500;font-size:14px}
.chip.sm{min-height:30px;border-radius:10px!important;font-size:13px;padding:5px 10px}
button:active:not(:disabled){transform:scale(.98)}
.btn,.chip,.tc-row,.qa-it,.rec{transition:transform .12s ease,background .2s,color .2s}
/* comidas */
.meal .mh{display:flex;align-items:center;gap:10px}
.mh-t{flex:1;min-width:0}
.mchk{appearance:none;flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:2px solid var(--faint);background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;transition:background .2s,border-color .2s}
.mchk:hover{border-color:#30d158}
.mchk.done{background:#30d158;border-color:#30d158}
.mchk.skip{background:var(--faint);border-color:var(--faint)}
.mchk.chg{background:#ffd21e;border-color:#ffd21e;color:#111}
.mmore{appearance:none;border:0;background:none;color:var(--muted);font-size:20px;line-height:1;width:32px;height:28px;border-radius:10px;cursor:pointer;flex:0 0 auto}
.mmore:hover,.mmore[aria-expanded="true"]{background:var(--card2);color:var(--fg)}
.meal.st-skip .mbar,.meal.st-skip .mnums,.meal.st-skip .mdish{opacity:.4}
.meal.st-skip .mh-t b{text-decoration:line-through;text-decoration-color:var(--faint)}
.meal .mlog{margin-top:10px}
/* avituallamiento */
.fu2{border-radius:14px;background:var(--card2)}
.fu2 summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px;min-height:68px}
.fu2 summary::-webkit-details-marker{display:none}
.fu2[open] .xb-ch{transform:rotate(180deg)}
.fu2.done .tc-meta b{color:var(--t-30d158,#30d158)}
.fu2-d{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.fu2-d p{margin:0;font-size:14px;color:var(--muted);line-height:1.5}
.fu2-k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fu2-k div{background:var(--card);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;border-top:3px solid var(--c)}
.fu2-k b{font-size:17px;font-variant-numeric:tabular-nums}.fu2-k span{font-size:12px;color:var(--muted)}
.fu2-tl{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.fu2-tl span{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:6px 10px;border-radius:10px;background:var(--card);font-variant-numeric:tabular-nums}
.fu2-tl b{font-size:13px}.fu2-tl small{font-size:11px;color:var(--t-ffd21e,#ffd21e)}
.fu2-d .btn{align-self:flex-start}
/* ===== MODO CLARO ===== */
html[data-theme="light"] .dr-it:hover{background:rgba(0,0,0,.04)}
html[data-theme="light"] .dr-it[aria-current="page"]{background:rgba(0,0,0,.06)}
html[data-theme="light"] .dr-ic{background:#e9e9ee;color:#6c6c70}
html[data-theme="light"] .dr-it[aria-current="page"] .dr-ic,html[data-theme="light"] .dr-it:hover .dr-ic{background:color-mix(in srgb,var(--c) 18%,#fff);color:color-mix(in srgb,var(--c) 70%,#000)}
html[data-theme="light"] .rad-ov{background:rgba(242,242,247,.72)}
html[data-theme="light"] .rad-svg{filter:drop-shadow(0 18px 40px rgba(0,0,0,.14))}
html[data-theme="light"] .rs-p{fill:#fff;stroke:rgba(0,0,0,.07)}
html[data-theme="light"] .rs-i{stroke:#8e8e93}html[data-theme="light"] .rs-i .fl{fill:#8e8e93}
html[data-theme="light"] .rs:hover .rs-p,html[data-theme="light"] .rs:focus-visible .rs-p{fill:var(--c);fill-opacity:.16}
html[data-theme="light"] .rs:hover .rs-i,html[data-theme="light"] .rs:focus-visible .rs-i{stroke:color-mix(in srgb,var(--c) 75%,#000)}
html[data-theme="light"] .rs:hover .rs-i .fl,html[data-theme="light"] .rs:focus-visible .rs-i .fl{fill:color-mix(in srgb,var(--c) 75%,#000)}
html[data-theme="light"] .rad-hub{fill:#f2f2f7}html[data-theme="light"] .rad-hub-ring{stroke:rgba(0,0,0,.07)}
html[data-theme="light"] .rad-x:hover .rad-hub{fill:#e5e5ea}
html[data-theme="light"] .rad-xl{stroke:#1c1c1e}
html[data-theme="light"] .rad-q2{fill:#1c1c1e}
html[data-theme="light"] .rad-cap{color:#1c1c1e}

html[data-theme="light"] svg:not(.logo svg) [stroke^="rgba(255,255,255"]{stroke:rgba(0,0,0,.09)}
html[data-theme="light"] svg [fill^="rgba(255,255,255"]{fill:rgba(60,60,67,.22)}
html[data-theme="light"] .glass:not([class*="card-"]) svg [stroke="#fff"],html[data-theme="light"] .glass:not([class*="card-"]) svg [stroke="#ffffff"]{stroke:#1c1c1e}
html[data-theme="light"] .glass:not([class*="card-"]) svg [fill="#fff"],html[data-theme="light"] .glass:not([class*="card-"]) svg [fill="#f4f5f7"]{fill:#1c1c1e}
html[data-theme="light"] .glass:not([class*="card-"]) .ax[style]{fill:var(--muted)!important}

html[data-theme="light"]{--t-ffe270:#8f6a00;--t-ffd21e:#8f6a00;--t-8ab4ff:#1f5fd6;--t-7fb0ff:#1f5fd6;--t-5b9bff:#1f5fd6;--t-ffa184:#c93a10;--t-ff8a66:#c93a10;--t-ff7a52:#c93a10;--t-ffaaa2:#c9100e;--t-ff6b5e:#c9100e;--t-c77dff:#8e2fc4;--t-5ac8fa:#0a7fb3;--t-30d158:#1c8f41;--t-a6f0b0:#1c8f41;--t-ffb340:#a86200;--t-carb:#8f6a00;--t-fat:#1f5fd6}

html[data-theme="light"]{color-scheme:light;
  --bg:#f2f2f7;--fg:#1c1c1e;--muted:#6c6c70;--faint:#a1a1a6;
  --card:#ffffff;--card2:#f2f2f7;--fill:rgba(120,120,128,.16);--fill2:rgba(120,120,128,.10);
  --sep:rgba(60,60,67,.16);--edge:rgba(0,0,0,.10);--edge-soft:rgba(0,0,0,.06);--glass:rgba(0,0,0,.03);--glass-hi:rgba(0,0,0,.06);
  --carb-t:#a77c00;--fat-t:#1f5fd6;--prot-t:#d9441b;--ok-t:#1f9d48}
html[data-theme="light"],html[data-theme="light"] body{background:#f2f2f7!important;color:var(--fg)}
html[data-theme="light"] .glass{box-shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 .5px rgba(0,0,0,.04)}
html[data-theme="light"] .sheet,html[data-theme="light"] .pop,html[data-theme="light"] .toast{background:rgba(255,255,255,.86)!important;border:.5px solid rgba(0,0,0,.08)!important;box-shadow:0 20px 50px rgba(0,0,0,.16)!important;color:var(--fg)}
html[data-theme="light"] .overlay{background:rgba(0,0,0,.28)}
html[data-theme="light"] .drawer{background:rgba(248,248,250,.9);border-right:.5px solid rgba(0,0,0,.08)}
html[data-theme="light"] .drawer-ov.open{background:rgba(0,0,0,.25)}
html[data-theme="light"] header.top::before{background:rgba(242,242,247,.8)}
html[data-theme="light"] header.top.scrolled::before{border-bottom-color:rgba(0,0,0,.1)}
html[data-theme="light"] .hbtn:hover{background:rgba(0,0,0,.06)}
html[data-theme="light"] .hbtn .sdot{box-shadow:0 0 0 2px #f2f2f7!important}
html[data-theme="light"] header .fab{background:#1c1c1e;color:#fff}
html[data-theme="light"] header.top .wordmark h1{color:#1c1c1e;background-image:linear-gradient(100deg,#1c1c1e 0%,#1c1c1e 32%,#2f6df6 43%,#5b5b60 50%,#c99a00 57%,#1c1c1e 68%,#1c1c1e 100%)}
html[data-theme="light"] .logo{background:#1c1c1e}
html[data-theme="light"] .btn.primary,html[data-theme="light"] .btn.primary:hover{background:#1c1c1e;color:#fff}
html[data-theme="light"] .chip[aria-pressed="true"]{background:#1c1c1e;color:#fff}
html[data-theme="light"] .seg button[aria-pressed="true"],html[data-theme="light"] .subtabs button[aria-selected="true"]{background:#fff;color:#1c1c1e;box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04)}
html[data-theme="light"] .seg,html[data-theme="light"] .subtabs{background:rgba(118,118,128,.12)}
html[data-theme="light"] .day[aria-pressed="true"] b{background:#1c1c1e;color:#fff}
html[data-theme="light"] .toast button{background:rgba(0,0,0,.06);color:#a77c00}
html[data-theme="light"] .wlast{stroke:#fff}
html[data-theme="light"] .tskip{background:rgba(0,0,0,.06)}

/* actividades: filtros y semanas */
.afbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 14px}
.dd{position:relative;display:flex;flex-direction:column;gap:1px;background:var(--card2,rgba(255,255,255,.06));border-radius:14px;padding:7px 34px 7px 12px;cursor:pointer;min-height:48px;justify-content:center}
.dd::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:1.8px solid var(--faint);border-bottom:1.8px solid var(--faint);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.dd>span{font-size:11px;color:var(--faint);letter-spacing:.02em;pointer-events:none}
.dd select{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;cursor:pointer}
.dd .dv{font-weight:600;font-size:15px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.wkg+.wkg{margin-top:20px}
.akv{margin-bottom:24px!important}.akv b{white-space:nowrap}.akv b small{font-size:.6em;font-weight:500;color:var(--muted,var(--faint))}
.wkh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 2px 6px;border-bottom:.5px solid var(--sep,var(--edge-soft))}
.wkh b{font-size:13px;font-weight:600;color:var(--fg)}
.wkh span{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}

/* plan › menú: cabeceras de día */
.pday summary{grid-template-columns:minmax(0,1fr) auto!important;gap:12px;align-items:center;padding:12px 16px!important;min-height:64px}
.pmain{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.pd.now{color:var(--fg);font-weight:600}
.pchips{gap:6px}
.badge.b-rest{background:var(--card2,rgba(127,127,127,.12));color:var(--muted)}
.pk{font-size:15px}

/* perfil: secciones plegables */
.psec{border-bottom:.5px solid var(--sep,var(--edge-soft))}
.psec:first-child{margin-top:-6px}
.psec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 2px;min-height:60px}
.psec>summary::-webkit-details-marker{display:none}
.psec[open] .xb-ch{transform:rotate(180deg)}
.ps-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ps-t b{font-size:17px;font-weight:600}
.ps-t small{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psec>fieldset{margin:0;padding:2px 2px 18px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#pform>.row{margin-top:16px}

/* plan › entrenos: filas */
.trow{grid-template-columns:52px minmax(0,1fr)!important}
.tbody{gap:8px}
.treal{flex-direction:column;gap:6px}
.tchip.trc{display:flex;width:100%;padding:7px 12px 7px 7px;gap:12px;text-align:left}
.tci{display:flex;flex-direction:column;gap:1px;min-width:0}
.tci b{font-size:14px;font-weight:600;white-space:nowrap}
.tci small{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tadd{appearance:none;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:40px;border-radius:10px;border:1px dashed var(--edge,rgba(127,127,127,.35));background:transparent;color:var(--muted);font:500 14px var(--font);cursor:pointer;margin-top:0!important;grid-column:auto!important}
.tadd:hover{color:var(--fg);border-color:var(--muted)}
.tadd:active{transform:scale(.98)}
.trest{font-size:14px;color:var(--faint);padding:8px 0}
.tday .wxp{display:none}
.wxd.na{background:transparent;border:1px dashed var(--sep,var(--edge-soft));opacity:.6}
.wxd em{font-style:normal;font-size:13px;color:var(--muted);height:22px;display:flex;align-items:center}
.wxd.na b{color:var(--faint)}
.kv b small.u{font-size:.6em;font-weight:500;color:var(--muted)}

.wxs.few .wxd{flex-direction:row;justify-content:center;gap:10px;padding:12px 10px}
.wxs.few .wxd small{font-size:13px;font-weight:600;color:var(--fg)}
.wxs.few .wxd b{font-size:17px}
.wxs.few .wxd span{font-size:13px}
.wxs.few .wxd i{font-size:12px;min-height:0}

/* tú frente a hace un año */
.ylg{display:flex;gap:16px;margin:12px 0 4px;font-size:12px;color:var(--muted)}
.ylg span{display:flex;align-items:center;gap:6px}
.ylg i{width:10px;height:10px;border-radius:3px}
.ylg i.now,.yr-b.now i{background:#ffd21e}
.ylg i.old,.yr-b.old i{background:var(--faint);opacity:.45}
.yr{padding:12px 0;border-top:.5px solid var(--sep,var(--edge-soft))}
.ylg+.yr{border-top:0}
.yr-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.yr-h span{font-size:14px;font-weight:600}
.yr-h em{font-style:normal;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.yr-b{display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:10px;align-items:center;height:20px}
.yr-b+.yr-b{margin-top:4px}
.yr-b i{display:block;height:8px;border-radius:4px}
.yr-b b{text-align:right;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.yr-b.old b{font-weight:500;color:var(--faint)}
/* casilla de comidas más discreta */
.mchk{width:22px!important;height:22px!important;border-width:1.5px!important;position:relative}
.mchk::after{content:"";position:absolute;inset:-11px}
.mchk svg{width:12px;height:12px}

/* logo gota */
.dsvg .dout{display:none}
.dsvg .dcover{transform:translateY(-70px)}
header.top .logo{color:#fff}
header.top .logo svg.dsvg{width:28px!important;height:28px!important}
header.top .logo .dgap,header.top .logo .dcover{stroke:#1c1c1e;fill:#1c1c1e}
header.top .logo .dgap{fill:none}
.wordmark .wm2{display:block!important;color:var(--fg)!important;font-size:20px!important}
.wm2{font-family:Manrope,var(--font);font-weight:800;font-size:20px;letter-spacing:-.035em;color:var(--fg);line-height:1;-webkit-text-fill-color:currentColor}
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;transition:opacity .4s ease}
#splash.out{opacity:0;pointer-events:none}
.spl-in{display:flex;flex-direction:column;align-items:center;gap:18px;color:var(--fg)}
.spl-in .dsvg{width:84px;height:84px}
.spl-in .wm2{font-size:28px;animation:splw .6s ease .5s both}
#splash .dgap{stroke:var(--bg)}#splash .dcover{fill:var(--bg)}
#splash .dcover{animation:dfill 1.1s cubic-bezier(.55,0,.25,1) .15s both}
@keyframes dfill{from{transform:translateY(0)}to{transform:translateY(-70px)}}
@keyframes splw{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
html.is-loading header.top .logo .dcover{animation:dloop 2s cubic-bezier(.5,0,.3,1) infinite}
@keyframes dloop{0%{transform:translateY(0)}50%,70%{transform:translateY(-70px)}100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){#splash .dcover,html.is-loading header.top .logo .dcover{animation:none;transform:translateY(-70px)}.spl-in .wm2{animation:none}}

/* esqueletos de carga */
.sk{display:block;border-radius:6px;background:linear-gradient(90deg,var(--card2,rgba(127,127,127,.12)) 0%,color-mix(in srgb,var(--card2,#222) 70%,var(--fg) 8%) 45%,var(--card2,rgba(127,127,127,.12)) 90%);background-size:220% 100%;animation:skm 1.4s ease-in-out infinite}
@keyframes skm{from{background-position:110% 0}to{background-position:-110% 0}}
.sk-t{height:14px;width:38%;margin-bottom:16px}
.sk-blk{height:72px;width:100%;border-radius:14px}
.sk-wh{height:12px;width:30%;margin:4px 0 10px}
.skr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 2px;border-bottom:.5px solid var(--sep,var(--edge-soft))}
.skr span{display:flex;flex-direction:column;gap:7px}
.skr .sk{height:12px}.skr .sk-s{height:10px}
.sk-ic{width:42px;height:42px;border-radius:14px}
.sk-v{width:48px;height:16px}
.tcard .skr{border:0;padding:4px 0}
.skr .sk-ic{width:42px;height:42px;border-radius:14px}.skr.bdg .sk-ic{width:76px;height:22px;border-radius:6px}.skr .sk-v{width:48px;height:16px}
.chip .spin{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;display:inline-block;margin-right:6px;vertical-align:-1px;animation:spn .8s linear infinite}
.chip.busy{opacity:.7}
@keyframes spn{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion:no-preference){.ob-body{animation:obin .35s cubic-bezier(.2,.8,.3,1)}@keyframes obin{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}}

   estados: bien verde, atención ámbar, alerta rojo. Nada de degradados multicolor.
